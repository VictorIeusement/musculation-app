<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salle à la maison</title>
<meta name="theme-color" content="#0E1013">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Séances">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<style>html,body{margin:0;padding:0;background:#0E1013;min-height:100%}</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <div id="timer-sheet" class="sheet hidden">
    <div class="sheet-inner">
      <button class="t-head" id="t-reduce" aria-expanded="true" aria-label="Réduire le minuteur">
        <span class="t-grab" aria-hidden="true"></span>
        <span class="t-rang">
          <span class="t-texte">
            <span class="t-label" id="t-label">Récupération</span>
            <span class="t-count" id="t-count">01:30</span>
          </span>
          <span class="t-chev" aria-hidden="true"></span>
        </span>
      </button>
      <div class="t-bar"><span id="t-fill"></span></div>
      <div class="ensuite" id="t-next"></div>
      <div class="t-actions">
        <button class="ghost" id="t-minus">−15 s</button>
        <button class="ghost" id="t-toggle">Pause</button>
        <button class="ghost" id="t-plus">+15 s</button>
      </div>
      <button class="solid wide" id="t-skip">Passer la récup</button>
    </div>
  </div>
  <div id="toast"></div>
</div>

<style>
  /* Direction « cockpit » : fond sombre, chiffres lumineux, un seul accent pour
     ce qui est actif. Tous les couples texte/fond sont au-dessus de 4,5:1 —
     l'ancien gris secondaire plafonnait à 3,47:1.
     --ink 16,5:1 · --steel 7,5:1 · --signal 11,3:1 · --hot 6,8:1 */
  :root{
    --concrete:#0E1013;        /* le fond de la page */
    --concrete-2:#2A2F36;      /* commandes au repos */
    --surface:#171A1F;         /* cartes et feuilles posées sur le fond */
    --ink:#EDEFF2;
    --ink-soft:#C3C9D2;
    --steel:#9BA3AE;
    --signal:#57E08A;
    --hot:#FF6B4A;
    --line:rgba(237,239,242,.12);
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  #app{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:var(--concrete);
    min-height:100%;
    max-width:520px;
    margin:0 auto;
    padding:0 0 128px;
    position:relative;
    overflow-x:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  h1,h2,h3,p,ul{margin:0}

  /* ---------- header ---------- */
  /* Quatre niveaux, nettement séparés : titre d'écran, titre de section, texte,
     tableau. L'accueil est le seul écran dont le titre est un surtitre — c'est
     le bloc « Prochaine séance » qui y porte le regard. Partout ailleurs le
     titre d'écran est le seul repère : à 15 px il passait sous un libellé de
     formulaire, et on ne savait plus sur quel écran on était. */
  .top{padding:26px 20px 18px;border-bottom:1px solid var(--line)}
  .top h1{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .top.page{padding:26px 20px 20px}
  .top.page h1{font-size:30px;line-height:1.05;letter-spacing:-.035em}
  .top .sub{font-size:13px;color:var(--steel);margin-top:3px}
  .top.page .sub{margin-top:6px;font-size:13.5px;max-width:36ch;line-height:1.45}
  .top button.sub{min-height:44px;padding:0 10px;border-radius:11px;background:var(--concrete-2);
                  color:var(--ink);font-weight:600;text-decoration:none}

  /* ---------- home ---------- */
  .hero{padding:24px 20px 28px;border-bottom:1px solid var(--line)}
  .hero .kicker{font-size:13px;color:var(--steel)}
  .hero h2{font-size:40px;line-height:1.02;font-weight:800;letter-spacing:-.035em;margin-top:6px}
  .hero .focus{font-size:15px;color:var(--ink-soft);margin-top:10px;max-width:34ch;line-height:1.45}
  .meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:18px;font-size:13px;color:var(--steel)}
  .meta b{display:block;font-size:22px;color:var(--ink);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

  .cta{
    display:block;width:calc(100% - 40px);margin:20px;padding:19px;
    background:var(--signal);color:var(--concrete);border-radius:var(--r);
    font-size:17px;font-weight:700;letter-spacing:-.01em;text-align:center;
  }
  .cta:active{transform:translateY(1px)}

  .section{padding:6px 20px 0}
  /* Deux niveaux, et c'est le second qui manquait : « Disques de barre » se
     lisait au même rang que « Barre olympique », alors qu'il en dépend. Le
     groupe porte le filet et la taille ; la sous-section n'a que les capitales
     espacées. La respiration va avant le titre, à la section qui s'ouvre, pas
     à celle qui se termine. */
  .group-h{margin-top:30px;padding:19px 0 7px;border-top:1px solid var(--line);
           font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  .group-h:first-child{margin-top:2px;padding-top:14px;border-top:0}
  .section-h{margin-top:20px;padding:0 0 8px;
             font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
             color:var(--steel)}

  .row{
    display:flex;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--line);
    width:100%;text-align:left;
  }
  .row .tag{
    width:34px;height:34px;flex:none;border-radius:9px;background:var(--concrete-2);color:var(--ink);
    display:grid;place-items:center;font-weight:800;font-size:15px;
  }
  .row.next .tag{background:var(--signal);color:var(--concrete)}
  .row .rt{flex:1;min-width:0}
  .row .rt strong{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .row .rt span{display:block;font-size:13px;color:var(--steel);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .go{font-size:13px;color:var(--steel)}

  .hist{border-top:1px solid var(--line);padding:14px 0;display:flex;gap:10px;align-items:baseline;
        width:100%;text-align:left;min-height:44px}
  .hist .d{font-size:13px;color:var(--steel);width:68px;flex:none;font-variant-numeric:tabular-nums}
  .hist .n{font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist .v{font-size:13px;color:var(--steel);font-variant-numeric:tabular-nums;flex:none}
  /* Texte d'explication. Il portait un filet, qui entrait en concurrence avec
     celui des titres de section : deux traits pour deux rôles différents, on ne
     savait plus lequel séparait quoi. Le filet est maintenant au titre seul. */
  .empty{padding:11px 0 4px;color:var(--steel);font-size:13.5px;line-height:1.55}

  .pl{padding:11px 0;border-top:1px solid var(--line)}
  .pl .pn{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .pl .pp{display:block;font-size:13px;color:var(--steel);margin-top:3px;font-variant-numeric:tabular-nums}
  .pl.soft .pn{font-weight:600;color:var(--steel)}

  /* balayage vers la gauche sur une ligne d'historique */
  .swipe{position:relative;overflow:hidden}
  .swipe .hist{position:relative;z-index:1;background:var(--concrete);transition:transform .18s ease;touch-action:pan-y}
  .swipe.open .hist{transform:translateX(-108px)}
  .swipe-del{position:absolute;top:1px;right:0;bottom:0;width:108px;background:var(--hot);color:var(--concrete);
             font-size:14px;font-weight:700;letter-spacing:-.01em}
  .hist .lvl{font-style:normal;font-size:12px;font-weight:600;color:var(--steel);flex:none}

  /* ---------- session ---------- */
  .prog{display:flex;gap:3px;padding:16px 20px 0}
  .prog i{height:3px;flex:1;background:var(--concrete-2);border-radius:2px}
  .prog i.done{background:var(--ink)}
  .prog i.now{background:var(--signal)}

  .exhead{padding:8px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
  /* 44 px de haut par du remplissage, pas en grossissant la typographie : le
     libellé reste discret, la cible reste atteignable au pouce. */
  .exhead .idx{font-size:13px;color:var(--steel);font-variant-numeric:tabular-nums;
               display:flex;align-items:center;min-height:44px;padding:0}
  .ex h2{padding:8px 20px 0;font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.03em}
  .ex .gear{padding:10px 20px 0;font-size:13px;color:var(--steel)}

  .sets{display:flex;gap:6px;padding:18px 20px 0;align-items:center}
  .sets i{width:26px;height:6px;border-radius:3px;background:var(--concrete-2)}
  .sets i.done{background:var(--ink)}
  .sets i.now{background:var(--signal)}
  .sets em{font-style:normal;font-size:13px;color:var(--steel);margin-left:6px}

  .fig{display:block;width:calc(100% - 32px);height:150px;margin:16px;
       background:var(--surface);border-radius:var(--r)}
  .fig .m{stroke:var(--ink);fill:none;stroke-linecap:round;stroke-linejoin:round}
  .fig .t{fill:var(--ink)}
  .fig .loin{opacity:.28}
  .fig .sol{stroke:rgba(237,239,242,.18);stroke-width:1.6}
  .fig .mat{stroke:var(--signal);stroke-linecap:round}
  .fig .matf{fill:var(--signal)}
  .fig .banc{fill:var(--steel)}
  .fig .band{stroke:var(--signal);fill:none;stroke-width:1.8;stroke-dasharray:3.5 2.5}
  .fig .axe{stroke:var(--signal);fill:none;stroke-width:.9;stroke-dasharray:2.5 2}
  .fig .axeT{fill:var(--signal);font:600 5.5px system-ui}
  /* ---------- suivi corporel ---------- */
  .plages{display:flex;gap:8px;padding:14px 0 2px}
  .plages button{min-height:44px;padding:0 16px;border-radius:11px;background:var(--concrete-2);
                 font-size:13px;font-weight:600;color:var(--ink)}
  .plages button.actif{background:var(--signal);color:var(--concrete)}
  .courbes{display:block;width:100%;margin-top:6px;overflow:visible;
           touch-action:pan-y;user-select:none;-webkit-user-select:none}
  .courbes .trace{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .courbes .bout{stroke:var(--concrete);stroke-width:2}
  .courbes .regle{stroke:var(--line);stroke-width:1}
  .courbes .titre{font:700 11px system-ui;fill:var(--ink)}
  .courbes .val{font:700 13px system-ui;fill:var(--ink);text-anchor:end}
  .courbes .ech{font:500 9px system-ui;fill:var(--steel)}
  .courbes .viseur{stroke:var(--ink);stroke-width:1;opacity:.45}
  .tab{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px;font-variant-numeric:tabular-nums}
  .tab th{font-size:12px;color:var(--steel);font-weight:600;text-align:right;padding:8px 0;border-bottom:1px solid var(--line)}
  .tab th:first-child{text-align:left}
  .tab td{text-align:right;padding:9px 0;border-top:1px solid var(--line);color:var(--ink-soft)}
  .tab th+th,.tab td+td{padding-left:12px}
  .tab td:first-child{text-align:left;color:var(--steel)}
  /* Une table peut dépasser la largeur du téléphone : elle défile dans son
     propre cadre, la page ne part jamais de travers. */
  .tab-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab-wrap .tab{min-width:340px}
  .pastille{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:1px}

  .video{display:flex;align-items:center;min-height:44px;margin:6px 20px 0;padding:14px 0;
         font-size:13px;color:var(--steel);text-decoration:underline;text-underline-offset:3px}

  .cues{margin:20px 20px 0;padding:16px 16px 16px 18px;background:var(--surface);border-radius:var(--r)}
  .cues li{font-size:14px;line-height:1.5;color:var(--ink-soft);margin-bottom:7px;list-style:none;position:relative;padding-left:14px}
  .cues li:last-child{margin-bottom:0}
  .cues li:before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--steel)}

  .dials{display:flex;gap:12px;padding:20px 20px 0}
  .dial{flex:1;border:0;border-radius:var(--r);padding:12px 10px;text-align:center;background:var(--surface)}
  .dial .dl{font-size:12px;color:var(--steel)}
  .dial .dv{font-size:27px;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
  .dial .dh{font-size:11px;color:var(--steel);min-height:14px;line-height:1.2}
  .dial .pm{display:flex;gap:8px;margin-top:10px}
  .dial .pm button{flex:1;height:38px;border-radius:9px;background:var(--concrete-2);font-size:19px;font-weight:700;line-height:1}
  .dial .pm button:active{background:var(--signal);color:var(--concrete)}

  .foot{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding:12px 20px 16px;
        background:linear-gradient(to top,var(--concrete) 72%,rgba(14,16,19,0));}
  .solid{display:block;width:100%;padding:18px;border-radius:var(--r);background:var(--signal);color:var(--concrete);font-size:17px;font-weight:700;text-align:center}
  .solid.blue{background:var(--signal)}
  .solid:active{transform:translateY(1px)}
  .under{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
  .under button{flex:1;min-height:44px;font-size:13px;font-weight:600;color:var(--steel);padding:6px 2px}

  /* ---------- timer sheet ---------- */
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);color:var(--ink);
         border-radius:20px 20px 0 0;padding:22px 20px 24px;z-index:40;overflow:hidden;transition:transform .22s ease}
  .sheet.hidden{transform:translateY(105%)}
  .sheet.alarm{background:var(--hot)}
  /* Le bandeau est un bouton : il replie la feuille pour rendre les consignes de
     l'exercice au regard, sans interrompre le décompte. */
  .t-head{display:block;width:100%;min-height:44px;padding:0;text-align:left}
  .t-grab{display:block;width:38px;height:4px;margin:0 auto 12px;border-radius:2px;background:var(--line)}
  .t-rang{display:flex;align-items:center;gap:12px}
  .t-texte{flex:1;min-width:0}
  .t-chev{flex:none;position:relative;width:30px;height:30px;color:var(--ink-soft)}
  .t-chev::before{content:"";position:absolute;left:8px;top:9px;width:12px;height:12px;
    border-left:2.2px solid currentColor;border-bottom:2.2px solid currentColor;transform:rotate(-45deg)}
  .sheet.mini .t-chev::before{top:13px;transform:rotate(135deg)}
  .t-label{display:block;font-size:13px;color:var(--ink-soft)}
  .t-count{display:block;font-size:68px;font-weight:800;letter-spacing:-.045em;line-height:1;margin:4px 0 14px;font-variant-numeric:tabular-nums}
  /* Repliée : une barre basse. Le décompte reste lisible, la progression passe
     sur l'arête haute, et « Passer » reste à portée de pouce. */
  .sheet.mini{padding:8px 16px 10px}
  .sheet.mini .sheet-inner{display:flex;align-items:center;gap:12px}
  .sheet.mini .t-head{flex:1;min-width:0}
  .sheet.mini .t-grab,.sheet.mini .ensuite,.sheet.mini .t-actions{display:none}
  .sheet.mini .t-texte{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .sheet.mini .t-count{font-size:27px;margin:0;letter-spacing:-.02em}
  .sheet.mini .t-bar{position:absolute;left:0;right:0;top:0;height:3px;border-radius:0}
  .sheet.mini .solid.wide{flex:0 0 auto;width:auto;min-height:44px;padding:11px 15px;font-size:14px}
  .t-bar{height:4px;background:rgba(237,239,242,.18);border-radius:2px;overflow:hidden}
  .t-bar span{display:block;height:100%;width:100%;background:var(--ink);border-radius:2px}
  .ensuite{margin:16px 0 0;padding:13px 15px;border-radius:12px;background:var(--concrete-2)}
  .ensuite .el{font-size:12px;color:var(--steel)}
  .ensuite .en{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-top:3px}
  .ensuite .ep{font-size:13px;color:var(--steel);margin-top:2px;font-variant-numeric:tabular-nums}
  .ensuite.vide{display:none}
  .t-actions{display:flex;gap:10px;margin:14px 0 12px}
  .ghost{flex:1;padding:15px 13px;border-radius:11px;background:var(--concrete-2);color:var(--ink);font-size:14px;font-weight:600}
  .sheet .solid{background:var(--signal);color:var(--concrete)}

  /* ---------- bilan de fin de séance ---------- */
  .score{margin:22px 0 2px;font-size:14px;color:var(--steel)}
  .score b{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
  .bil{margin-top:16px}
  .bil .bl{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
  .bil .bn{flex:1;min-width:0}
  .bil .bd{color:var(--steel);font-variant-numeric:tabular-nums;text-align:right}
  .bil .bt{flex:0 0 54px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
  .bil .bt.ok{color:var(--signal)}
  .note{font-size:13px;color:var(--steel);padding:12px 0 0;line-height:1.5}

  /* ---------- summary ---------- */
  .sum{padding:30px 20px 0}
  .sum h2{font-size:36px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
  .sum .grid{display:flex;gap:24px;margin:22px 0 4px;flex-wrap:wrap}
  .sum .grid div{font-size:13px;color:var(--steel)}
  .sum .grid b{display:block;font-size:28px;color:var(--ink);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .lines{margin-top:18px}
  .lines div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
  .lines span{color:var(--steel);font-variant-numeric:tabular-nums;flex:none}

  #toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,14px);background:var(--concrete-2);color:var(--ink);
         padding:11px 16px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:88%}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  .gline{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
  .gline label{flex:1;font-size:15px}
  .gline input{width:84px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
               font:700 17px system-ui;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
  .gline em{font-style:normal;font-size:13px;color:var(--steel);width:52px}
  .gline .del{min-height:44px;padding:0 8px;font-size:13px;color:var(--steel);text-decoration:underline;text-underline-offset:3px}
  .gline .add{min-height:44px;padding:13px 14px;border-radius:10px;background:var(--concrete-2);color:var(--ink);font-size:14px;font-weight:600}
  .back{padding:22px 20px 0;font-size:13px;color:var(--steel)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px}
</style>

<script>
(function(){
"use strict";

/* =========================================================
   1. PROGRAMME
   Charges disponibles : barre olympique 20 kg + 2×5 + 2×7,5
   => 20 / 30 / 35 / 45 kg (chargement symétrique obligatoire)
   Haltères : 1 à 8 kg par haltère
   ========================================================= */
/* Deux inventaires distincts, et ce n'est pas un détail : les disques d'une
   barre olympique ont un alésage de 50 mm, ceux d'un haltère de 28 — ils ne
   passent pas d'une barre à l'autre. Les disques de barre se comptent en
   PAIRES (elle se charge des deux côtés), ceux d'haltère en PIÈCES, parce que
   selon l'exercice on en charge un seul ou les deux. */
const DEFAULT_GEAR = {bar:20, plates:[{w:5,n:1},{w:7.5,n:1}],
                      dbBar:2, dbPlates:[{w:2,n:8},{w:1,n:8}]};
let BAR=[], BAR_HINT={}, DB=[], DB_HINT={}, DB_UNI=[], DB_UNI_HINT={};

/* Toutes les charges atteignables en chargeant symétriquement. `parCran` est le
   nombre de disques qu'un cran consomme dans l'inventaire : 1 pour une paire de
   disques de barre, 2 pour un haltère chargé seul (un disque de chaque côté),
   4 quand il faut deux haltères identiques. C'est ce qui explique qu'un
   exercice à un seul haltère monte deux fois plus haut avec le même sac. */
function combos(plates,parCran,base,nom){
  const map={};
  (function rec(i,load,used){
    if(i>=plates.length){
      const k=Math.round(load*10)/10;
      const d=used.length?used.map(fmt).join(" + ")+" de chaque côté":nom;
      if(!(k in map)||d.length<map[k].length) map[k]=d;
      return;
    }
    const p=plates[i], max=Math.floor((p.n||0)/parCran);
    for(let c=0;c<=max;c++){
      const u=used.slice(); for(let j=0;j<c;j++) u.push(p.w);
      rec(i+1, load+2*p.w*c, u);
    }
  })(0,base,[]);
  return {liste:Object.keys(map).map(Number).sort((a,b)=>a-b), hint:map};
}
function buildLoads(){
  const g=DATA.gear;
  const b=combos(g.plates||[],1,g.bar,"barre seule");
  BAR=b.liste; BAR_HINT=b.hint;
  const deux=combos(g.dbPlates||[],4,g.dbBar,"haltère seul");
  DB=deux.liste; DB_HINT=deux.hint;
  const un=combos(g.dbPlates||[],2,g.dbBar,"haltère seul");
  DB_UNI=un.liste; DB_UNI_HINT=un.hint;
}

const hintDe=e=> e.load==="bar" ? BAR_HINT : (e.uni?DB_UNI_HINT:DB_HINT);

/* durée estimée : travail + récup courante, hors transitions.
   Elle suit les objectifs courants, relevés par le niveau de difficulté,
   et doit rester sous 45 minutes : c'est ce que vérifie raiseLevel(). */
function estimate(p){
  let s=0;
  p.ex.forEach(e=>{
    const work = e.type==="time" ? getD(p.id,e) : getR(p.id,e)*3.5*(e.side?2:1);
    s += e.sets*(work+getRest(p.id,e));
  });
  return Math.round(s/60);
}

/* =========================================================
   1 bis. FIGURES
   Une illustration par exercice, dessinée en SVG dans la page : rien à charger,
   rien à mettre en cache, ça marche hors ligne comme le reste.

   Pictogramme réglé sur environ huit têtes, dans un repère 120×80, sol à y=72.
   Les épaisseurs sont hiérarchisées — cuisse 5, mollet 4, bras 3,6, avant-bras 3
   — et le tronc est une forme pleine qui porte les articulations : des membres
   d'égale largeur et une tête ronde surdimensionnée ne peuvent faire qu'un
   pantin enfantin. Le membre qui passe devant le corps est d'abord tracé à la
   couleur du fond, un peu plus large : sans ce liseré il se fond dans le tronc
   et le geste devient illisible sur les mouvements penchés.

   Vue de profil, sauf mention. Conséquence à respecter : une barre dont l'axe
   traverse les épaules s'y voit PAR LA TRANCHE, donc comme un disque, jamais
   comme un trait horizontal — dessiner une barre vue de face sur un corps vu de
   profil laisse croire qu'elle est dans l'axe du corps. Les exercices dont le
   geste se perd de profil, comme les élévations latérales, sont dessinés de
   face et le disent dans leur description.

   Ces schémas donnent la position et l'angle qui décide de la technique ; les
   consignes de l'exercice et le lien vidéo portent le reste.
   ========================================================= */

const L=(a,b,w,loin=false,sep=false)=>
  (sep?`<path style="stroke:var(--surface);fill:none;stroke-linecap:round;stroke-width:${w+2.2}" d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}"/>`:"")+
  `<path class="m${loin?" loin":""}" style="stroke-width:${w}" d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}"/>`;
const tronc=(e,h,we=9,wh=7.5)=>{const dx=h[0]-e[0],dy=h[1]-e[1],Lg=Math.hypot(dx,dy)||1,nx=-dy/Lg,ny=dx/Lg;
  const p=(pt,w,s)=>`${pt[0]+nx*w/2*s},${pt[1]+ny*w/2*s}`;
  return `<path class="t" d="M${p(e,we,1)} L${p(h,wh,1)} L${p(h,wh,-1)} L${p(e,we,-1)} Z"/>`;};
const tete=(c,a=0)=>`<ellipse class="t" cx="${c[0]}" cy="${c[1]}" rx="3" ry="3.5" transform="rotate(${a} ${c[0]} ${c[1]})"/>`;
const cou=(t,e)=>L(t,e,3.2);
const bras=(e,c,m,loin,sep)=>L(e,c,3.6,loin,sep)+L(c,m,3,loin,sep);
const jambe=(h,g,p,loin,sep)=>L(h,g,5,loin,sep)+L(g,p,4,loin,sep);

/* barre vue par la tranche : le disque, avec son moyeu et l'about de barre */
const disque=(x,y,r=7)=>`<g><circle class="matf" cx="${x}" cy="${y}" r="${r}"/>
  <circle cx="${x}" cy="${y}" r="${r*0.34}" style="fill:var(--surface)"/>
  <rect class="matf" x="${x-1.1}" y="${y-r-2.6}" width="2.2" height="2.8" rx=".8"/>
  <rect class="matf" x="${x-1.1}" y="${y+r-0.2}" width="2.2" height="2.8" rx=".8"/></g>`;
/* barre vue de face : seulement pour les figures dessinées de face */
const barreFace=(a,b)=>`<g><path class="mat" style="stroke-width:1.8" d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}"/>
 <rect class="matf" x="${a[0]-1.3}" y="${a[1]-4.5}" width="2.6" height="9" rx="1"/>
 <rect class="matf" x="${b[0]-1.3}" y="${b[1]-4.5}" width="2.6" height="9" rx="1"/></g>`;
const halt=(x,y)=>`<g class="matf"><rect x="${x-3.2}" y="${y-1}" width="6.4" height="2" rx=".8"/><rect x="${x-5}" y="${y-3}" width="2.4" height="6" rx="1"/><rect x="${x+2.6}" y="${y-3}" width="2.4" height="6" rx="1"/></g>`;
/* haltère tenu debout : un seul haltère saisi à deux mains par le disque du
   haut, son axe est vertical — de profil il se voit donc dressé, pas couché. */
const haltDebout=(x,y)=>`<g class="matf"><rect x="${x-1}" y="${y-3.2}" width="2" height="6.4" rx=".8"/><rect x="${x-3}" y="${y-5.4}" width="6" height="2.4" rx="1"/><rect x="${x-3}" y="${y+3}" width="6" height="2.4" rx="1"/></g>`;
/* haltère vu par la tranche (bras tendu vers l'observateur) */
const haltTranche=(x,y)=>`<g><circle class="matf" cx="${x}" cy="${y}" r="4.4"/><circle cx="${x}" cy="${y}" r="1.5" style="fill:var(--surface)"/></g>`;
const banc=(x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1,Lg=Math.hypot(dx,dy)||1,nx=-dy/Lg*1.4,ny=dx/Lg*1.4;
  return `<g class="banc"><path d="M${x1+nx} ${y1+ny} L${x2+nx} ${y2+ny} L${x2-nx} ${y2-ny} L${x1-nx} ${y1-ny} Z"/>
   <rect x="${x1+4}" y="${y1}" width="2.2" height="${72-y1}" rx=".8"/><rect x="${x2-6}" y="${y2}" width="2.2" height="${72-y2}" rx=".8"/></g>`;};
const marche=(x,y,w=32)=>`<g class="banc"><rect x="${x}" y="${y}" width="${w}" height="${72-y}" rx="1"/></g>`;
/* Banc vu par le BOUT. Même règle que la barre : quand on est assis ou appuyé
   EN TRAVERS du banc — dips, hip thrust — sa longueur part vers l'observateur et
   il ne s'en voit, de profil, que la largeur d'assise. Le dessiner en planche
   laisserait croire qu'on est allongé dessus, dans l'axe. */
const bancTranche=(cx,yTop,w=12)=>`<g class="banc">
  <rect x="${cx-w/2}" y="${yTop}" width="${w}" height="3.4" rx="1.2"/>
  <rect x="${cx-1.4}" y="${yTop+3.2}" width="2.8" height="${72-yTop-3.2}" rx=".9"/>
  <rect x="${cx-w/2+0.8}" y="70.2" width="${w-1.6}" height="2" rx=".8"/></g>`;
const bande=(a,b)=>`<path class="band" d="M${a[0]} ${a[1]} Q ${(a[0]+b[0])/2} ${(a[1]+b[1])/2-8} ${b[0]} ${b[1]}"/>`;
const axe=(a,b,c,d,t,tx,ty)=>`<path class="axe" d="M${a} ${b} L${c} ${d}"/><text class="axeT" x="${tx}" y="${ty}">${t}</text>`;
const roue=(x,y)=>`<g><circle class="matf" cx="${x}" cy="${y}" r="6"/><circle cx="${x}" cy="${y}" r="2" style="fill:var(--surface)"/></g>`;

const KEY="workout:data";
const BLANK={history:[],weights:{},reps:{},dur:{},rest:{},level:{},deleted:{},nextIdx:0,gear:null,cur:null,body:[],bodyFrom:0,balanceAt:0,balanceLiee:false};

async function load(){

/* Les haltères se réglaient par un plafond et un pas fixe, ce qui ne décrit
   aucun sac de disques réel. On passe à un inventaire, comme la barre. Rien à
   reprendre de l'ancien modèle : un plafond et un pas ne disent pas quels
   disques on possède. */
function migrerHalteres(){
  const g=DATA.gear; if(!g) return;
  if(!Array.isArray(g.dbPlates)||!g.dbPlates.length)
    g.dbPlates=JSON.parse(JSON.stringify(DEFAULT_GEAR.dbPlates));
  delete g.dbMax; delete g.dbStep;
}
function localSave(){
  try{ localStorage.setItem(KEY,JSON.stringify(DATA)); }
  catch(e){ persistent=false; toast("Sauvegarde refusée par le navigateur : pense à exporter"); }
}
async function save(){ DATA.updated=Date.now(); localSave(); syncNow(true); }

/* Fusion de deux états. Les séances sont réunies par date (jamais perdues),
   sauf celles supprimées à la main : leur date reste inscrite dans `deleted`,
   sinon la copie de l'autre appareil les ferait revenir. Le reste vient du
   côté modifié le plus récemment. */
function trimDeleted(d){
  const out={};
  Object.keys(d).sort((x,y)=>y-x).slice(0,200).forEach(k=>out[k]=d[k]);
  return out;
}
function merge(a,b){
  const seen={}, dead=Object.assign({},a.deleted||{},b.deleted||{});
  [].concat(b.history||[],a.history||[]).forEach(s=>{ if(s&&s.d&&!seen[s.d]&&!dead[s.d]) seen[s.d]=s; });
  const newer=(a.updated||0)>=(b.updated||0)?a:b, older=newer===a?b:a;
  const both=k=>Object.assign({},older[k]||{},newer[k]||{});
  return {
    history:Object.keys(seen).map(k=>seen[k]).sort((x,y)=>y.d-x.d).slice(0,120),
    weights:both("weights"), reps:both("reps"), dur:both("dur"), rest:both("rest"), level:both("level"),
    deleted:trimDeleted(dead),
    body:fusionCorps(a.body,b.body),
    bodyFrom:(newer.bodyFrom!=null?newer.bodyFrom:older.bodyFrom)||0,
    gear:newer.gear||older.gear,
    nextIdx:newer.nextIdx!=null?newer.nextIdx:0,
    updated:Math.max(a.updated||0,b.updated||0),
    sync:a.sync, syncedAt:a.syncedAt, cur:a.cur,
    balanceAt:a.balanceAt||0, balanceLiee:!!a.balanceLiee
  };
}

/* =========================================================
   2 ter. COMPOSITION CORPORELLE
   Mesures importées depuis un export de balance (Withings et compatibles).
   Une mesure par jour, la plus récente l'emporte ; tout est en kilos, sauf le
   taux de masse grasse, en pourcentage. Ces données suivent le même chemin que
   le reste : stockage local, et chiffrées si la sauvegarde en ligne est active.
   ========================================================= */
const jourDe=t=>new Date(t).toISOString().slice(0,10);

/* Une balance qui change de mode ou de profil produit une rupture : les mesures
   d'avant ne sont pas comparables à celles d'après. `bodyFrom` fixe le début du
   suivi ; ce qui précède est ignoré partout sans être effacé — c'est un réglage
   qui se défait, pas une suppression. Et comme il vit dans les données et non
   dans l'import, il résiste au réimport du même fichier. */
function mesuresRetenues(){
  const d=DATA.bodyFrom||0;
  return (DATA.body||[]).filter(m=>m.d>=d);
}

/* Une mesure par jour, la PREMIÈRE : on se pèse le matin à jeun, et une pesée
   du soir après le repas pèse un à deux kilos de plus. Garder la plus tardive
   ferait remonter la courbe pour une raison qui n'a rien à voir avec la forme. */
function fusionCorps(a,b){
  const par={};
  [].concat(b||[],a||[]).forEach(m=>{
    if(!m||!m.d) return;
    const k=jourDe(m.d);
    if(!par[k]||m.d<par[k].d) par[k]=m;
  });
  return Object.keys(par).map(k=>par[k]).sort((x,y)=>y.d-x.d).slice(0,2000);
}

/* Lecture d'un CSV. Le séparateur est déduit de la ligne d'entête et lui seul
   découpe : un export français sépare en points-virgules et écrit ses décimales
   en virgules, couper sur les deux briserait chaque nombre en deux. */
function delimDe(txt){
  const tete=(txt.split(/\r?\n/)[0]||"");
  let best=",", n=-1;
  [",",";","\t"].forEach(d=>{ const c=tete.split(d).length-1; if(c>n){ n=c; best=d; } });
  return best;
}
function lireCSV(txt){
  const sep=delimDe(txt), out=[];
  let champ="", ligne=[], guill=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(guill){
      if(c==='"'){ if(txt[i+1]==='"'){ champ+='"'; i++; } else guill=false; }
      else champ+=c;
    }
    else if(c==='"') guill=true;
    else if(c===sep){ ligne.push(champ); champ=""; }
    else if(c==="\n"){ ligne.push(champ); out.push(ligne); ligne=[]; champ=""; }
    else if(c!=="\r") champ+=c;
  }
  if(champ!==""||ligne.length){ ligne.push(champ); out.push(ligne); }
  return out.filter(l=>l.some(v=>v.trim()!==""));
}

/* Les entêtes varient selon la langue et la version de l'export : on les
   reconnaît par mots-clés, du plus précis au plus général. */
const sansAccent=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const normEntete=t=>sansAccent(t).replace(/\(.*?\)/g," ").replace(/[^a-z% ]+/g," ").replace(/\s+/g," ").trim();
const COLONNES=[
  ["fatpc", ["% masse grasse","taux de masse grasse","% graisse","fat percentage","fat ratio","body fat %"]],
  ["fat",   ["masse grasse","fat mass","graisse","gras","body fat"]],
  ["muscle",["masse musculaire","muscle mass","muscle"]],
  ["bone",  ["masse osseuse","bone mass"]],
  ["water", ["masse hydrique","hydratation","hydration","water"]],
  ["kg",    ["poids","weight"]],
  ["d",     ["date","time"]]
];
function nombreDe(v){
  const n=parseFloat(String(v).replace(",",".").replace(/[^0-9.\-]/g,""));
  return isNaN(n)?null:n;
}
function dateDe(v){
  const t=String(v).trim();
  let ms=Date.parse(t.replace(" ","T"));
  if(!isNaN(ms)) return ms;
  const fr=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})(?:\D+(\d{1,2}):(\d{2}))?/);
  if(fr) return new Date(+fr[3],+fr[2]-1,+fr[1],+(fr[4]||12),+(fr[5]||0)).getTime();
  return null;
}

/* Renvoie {mesures, colonnes} ou lève une erreur explicite. */
function lireBalance(txt){
  const lignes=lireCSV(txt);
  if(lignes.length<2) throw new Error("fichier vide");
  const entetes=lignes[0].map(normEntete), place={};
  entetes.forEach((h,i)=>{
    if(!h) return;
    for(const [cle,mots] of COLONNES){
      if(place[cle]!=null) continue;
      if(mots.some(m=>h===m||h.startsWith(m)||h.indexOf(m)>=0)){ place[cle]=i; return; }
    }
  });
  if(place.d==null) throw new Error("colonne de date introuvable");
  if(place.kg==null&&place.fat==null&&place.muscle==null) throw new Error("aucune mesure reconnue");
  const mesures=[];
  for(let i=1;i<lignes.length;i++){
    const l=lignes[i], d=dateDe(l[place.d]);
    if(!d) continue;
    const m={d};
    ["kg","fat","fatpc","muscle","bone","water"].forEach(k=>{
      if(place[k]!=null){ const v=nombreDe(l[place[k]]); if(v!=null&&v>0) m[k]=v; }
    });
    if(m.fatpc==null&&m.fat!=null&&m.kg) m.fatpc=Math.round(m.fat/m.kg*1000)/10;
    if(m.kg!=null||m.fat!=null||m.muscle!=null) mesures.push(m);
  }
  if(!mesures.length) throw new Error("aucune ligne lisible");
  return {mesures, colonnes:Object.keys(place).filter(k=>k!=="d")};
}

/* Chiffrement de bout en bout.
   La phrase saisie dans « Matériel » ne quitte jamais l'appareil. On en dérive
   deux valeurs distinctes, par deux sels différents :
   - un jeton d'authentification, envoyé au serveur : c'est lui qu'il faut
     donner à `wrangler secret put SYNC_KEY`, jamais la phrase ;
   - une clé AES-GCM, qui ne sort pas du navigateur.
   Le serveur ne stocke donc que des octets illisibles, et ne détient rien qui
   permette de les relire. Perdre la phrase, c'est perdre la sauvegarde : il
   n'existe aucun moyen de la récupérer, et c'est le prix du vrai chiffrement. */
const ROUNDS=210000;
let derived={phrase:null,keys:null};
const utf8=t=>new TextEncoder().encode(t);
function b64(buf){ let t=""; new Uint8Array(buf).forEach(c=>t+=String.fromCharCode(c)); return btoa(t); }
function unb64(t){ const bin=atob(t), a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }

async function derive(phrase){
  if(derived.phrase===phrase) return derived.keys;
  const sub=window.crypto&&window.crypto.subtle;
  if(!sub) throw new Error("chiffrement indisponible");
  const base=await sub.importKey("raw",utf8(phrase),"PBKDF2",false,["deriveBits","deriveKey"]);
  const rec=sel=>({name:"PBKDF2",salt:utf8(sel),iterations:ROUNDS,hash:"SHA-256"});
  const token=b64(await sub.deriveBits(rec("seances-jeton-v1"),base,256));
  const key=await sub.deriveKey(rec("seances-chiffre-v1"),base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  derived={phrase,keys:{token,key}};
  return derived.keys;
}
async function seal(obj,key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,utf8(JSON.stringify(obj)));
  return {v:1,alg:"AES-GCM",iv:b64(iv),ct:b64(ct)};
}
async function unseal(env,key){
  const clair=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(env.iv)},key,unb64(env.ct));
  return JSON.parse(new TextDecoder().decode(clair));
}

let syncing=false;
async function syncNow(silent){
  const s=DATA.sync;
  if(!s||!s.url||!s.key||syncing) return false;
  syncing=true;
  try{
    let k;
    try{ k=await derive(s.key); }
    catch(e){ if(!silent) toast("Chiffrement indisponible sur ce navigateur"); return false; }
    const head={authorization:"Bearer "+k.token};
    const r=await fetch(s.url,{headers:head,cache:"no-store"});
    if(r.status===401){ if(!silent) toast("Phrase refusée par le serveur"); return false; }
    if(!r.ok) throw new Error("get");
    const body=await r.json();
    let remote=null;
    if(body&&body.ct){
      try{ remote=await unseal(body,k.key); }
      catch(e){
        /* mauvaise phrase : on s'arrête avant d'écrire, sinon on écrase une
           sauvegarde encore bonne avec l'état de cet appareil. */
        if(!silent) toast("Sauvegarde illisible : ce n'est pas la bonne phrase");
        return false;
      }
    } else if(body&&body.history) remote=body; // sauvegarde d'avant le chiffrement
    if(remote&&remote.history) DATA=merge(DATA,remote);
    const payload=Object.assign({},DATA); delete payload.sync; delete payload.syncedAt; delete payload.cur;
    const p=await fetch(s.url,{method:"PUT",headers:Object.assign({"content-type":"application/json"},head),body:JSON.stringify(await seal(payload,k.key))});
    if(!p.ok) throw new Error("put");
    DATA.syncedAt=Date.now(); localSave();
    if(!silent) toast("Sauvegardé, chiffré");
    return true;
  }catch(e){
    if(!silent) toast("Serveur injoignable : les séances restent sur cet appareil");
    return false;
  }finally{ syncing=false; }
}
function exportData(){
  const b=new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="entrainement-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.history) throw 0;

    }catch(e){ toast("Fichier illisible : choisis un export de cette app"); }

const wKey=(pid,ex)=>pid+"|"+ex.n;
function getW(pid,ex){
  const v=(DATA.weights||{})[wKey(pid,ex)];
  const w=v!=null?v:(ex.def!=null?ex.def:0);
  if(ex.load!=="bar"&&ex.load!=="db") return w;
  /* Une charge que l'inventaire ne sait pas composer ne doit jamais être
     proposée : ni un défaut de programme arrondi, ni une valeur enregistrée
     avant que le sac de disques ne change. */
  const list=listeDe(ex);
  return list.length?list[nearest(list,w)]:w;
}
function getR(pid,ex){
  const v=(DATA.reps||{})[wKey(pid,ex)];
  return v!=null?v:(ex.reps||0);
}
function getD(pid,ex){
  const v=(DATA.dur||{})[wKey(pid,ex)];
  return v!=null?v:(ex.dur||0);
}
function getRest(pid,ex){
  const v=(DATA.rest||{})[wKey(pid,ex)];
  return v!=null?v:(ex.rest||0);
}
/* plancher de récupération : on ne descend pas sous 60 % du programme, ni sous 30 s */
const restFloor=ex=>Math.max(30,Math.round(ex.rest*0.6));
/* index de la charge la plus proche dans une liste composable */
function nearest(list,w){
  let k=list.indexOf(w);
  if(k<0){ k=0; list.forEach((v,j)=>{ if(Math.abs(v-w)<Math.abs(list[k]-w)) k=j; }); }
  return k;
}

/* =========================================================
   2 bis. NIVEAU DE DIFFICULTÉ
   Un niveau par séance (A, B, C), conservé d'une fois sur l'autre et inscrit
   dans l'historique. Monter d'un niveau suit une progression double : on ajoute
   des répétitions d'abord, et seulement une fois la marge atteinte on passe au
   cran de charge suivant en revenant aux répétitions de départ. C'est ce qui
   rend la montée raisonnable : jamais plus d'un cran, jamais une charge que la
   barre ne sait pas composer.
   ========================================================= */
/* Ces trois plafonds tiennent la séance sous 45 minutes. Une répétition en plus
   coûte du temps sur toutes les séries ; un cran de charge n'en coûte aucun.
   D'où une marge courte avant de charger, et des plafonds bas là où il n'y a
   rien à charger (poids du corps, élastique, gainage). */
const MARGE_REPS=1;    // répétitions gagnées avant de passer au cran de charge
const MAX_REPS=4;      // plafond au poids du corps, au-dessus de l'objectif
const MAX_DUR=20;      // plafond en secondes sur le gainage

/* Trois leviers, dans cet ordre : répétitions, puis charge, puis récupération.
   Quand la barre et les haltères sont au maximum de l'inventaire, il ne reste
   que la densité : raccourcir la récup durcit la séance et, contrairement aux
   répétitions, la raccourcit au lieu de l'allonger. */
function cutRest(pid,e){
  const k=wKey(pid,e), bas=restFloor(e), cur=getRest(pid,e);
  if(e.rest<=0||cur<=bas) return false;
  DATA.rest[k]=Math.max(bas,cur-5);
  return true;
}

function levelUp(pid){
  const p=PROGRAM.find(q=>q.id===pid); if(!p) return 0;
  p.ex.forEach(e=>{
    const k=wKey(pid,e);
    if(e.load==="none") return;                       // échauffement, étirements
    if(e.type==="time"){
      if(getD(pid,e)<(e.dur||0)+MAX_DUR) DATA.dur[k]=getD(pid,e)+5;
      else cutRest(pid,e);
      return;
    }
    if(e.load==="bar"||e.load==="db"){
      const cur=getR(pid,e);
      if(cur<(e.reps||0)+MARGE_REPS){ DATA.reps[k]=cur+1; return; }
      const list=listeDe(e), i=nearest(list,getW(pid,e));
      if(i<list.length-1){ DATA.weights[k]=list[i+1]; DATA.reps[k]=e.reps; return; }
      if(cur<(e.reps||0)+MAX_REPS){ DATA.reps[k]=cur+1; return; }  // déjà au plus lourd
      cutRest(pid,e);
      return;
    }
    if(getR(pid,e)<(e.reps||0)+MAX_REPS) DATA.reps[k]=getR(pid,e)+1;  // poids du corps, élastique
    else cutRest(pid,e);
  });
  DATA.level[pid]=(DATA.level[pid]||0)+1;
  return DATA.level[pid];
}

/* Applique un niveau en tenant le budget de 45 minutes. Si la montée déborde,
   on la paie en récupération, seul levier qui durcit la séance en la
   raccourcissant. Et si même là ça ne rentre plus, on revient en arrière
   plutôt que d'allonger la séance. */
function raiseLevel(pid){
  const p=PROGRAM.find(q=>q.id===pid); if(!p) return 0;
  const avant=JSON.stringify({w:DATA.weights,r:DATA.reps,d:DATA.dur,t:DATA.rest,l:DATA.level});
  const empreinte=()=>JSON.stringify(p.ex.map(e=>[getW(pid,e),getR(pid,e),getD(pid,e),getRest(pid,e)]));
  const depart=empreinte();
  const n=levelUp(pid);
  while(estimate(p)>45){
    const e=p.ex.filter(x=>x.rest>0&&getRest(pid,x)>restFloor(x))
                .sort((a,b)=>getRest(pid,b)-getRest(pid,a))[0];
    if(!e) break;
    cutRest(pid,e);
  }
  const bloque = estimate(p)>45, fige = empreinte()===depart;
  if(bloque||fige){
    const v=JSON.parse(avant);
    DATA.weights=v.w; DATA.reps=v.r; DATA.dur=v.d; DATA.rest=v.t; DATA.level=v.l;
    toast(bloque ? "Séance déjà à 45 minutes : impossible d'en ajouter"
                 : "Maximum atteint avec ce matériel : ajoute un disque dans Matériel");
    return 0;
  }
  save();
  return n;
}
/* « Trop dur » est le miroir de « Trop facile », à une autre portée — et ce
   n'est pas une étourderie. Une séance se juge trop facile à la fin, dans son
   ensemble ; un exercice se révèle trop lourd tout de suite, celui-là et pas
   les autres. On descend donc un seul exercice, d'un seul cran, en défaisant la
   montée dans l'ordre inverse : les répétitions gagnées d'abord, la charge
   ensuite, et la récupération rognée en dernier recours. Le réglage s'inscrit
   dans les données : la prochaine séance repart de là. */
const repsFloor=e=>Math.max(3,(e.reps||0)-3);
const durFloor=e=>Math.max(15,Math.round((e.dur||0)*0.5));

function lowerEx(pid,e){
  if(e.load==="none") return null;
  const k=wKey(pid,e);
  if(e.type==="time"){
    const d=getD(pid,e);
    if(d>durFloor(e)){ DATA.dur[k]=Math.max(durFloor(e),d-5); return "durée ramenée à "+DATA.dur[k]+" s"; }
    return rendreRecup(pid,e);
  }
  const r=getR(pid,e);
  if(r>(e.reps||0)){ DATA.reps[k]=e.reps; return "répétitions ramenées à "+e.reps; }
  if(e.load==="bar"||e.load==="db"){
    const list=listeDe(e), w=getW(pid,e), i=nearest(list,w);
    const leger=i>0?list[i-1]:null;
    const bas=()=>{ DATA.weights[k]=leger; return "charge ramenée à "+fmt(leger)+" kg"; };
    /* Avec un inventaire court, le cran de charge peut retirer un tiers du
       poids d'un coup : passé 15 %, on enlève d'abord une répétition, qui se
       dose. C'est toujours un cran, mais le bon. */
    if(leger!=null&&(w-leger)/w<=0.15) return bas();
    if(r>repsFloor(e)){ DATA.reps[k]=r-1; return "répétitions ramenées à "+(r-1); }
    if(leger!=null) return bas();
    return rendreRecup(pid,e);
  }
  if(r>repsFloor(e)){ DATA.reps[k]=r-1; return "répétitions ramenées à "+(r-1); }
  return rendreRecup(pid,e);
}
/* Dernier recours : rendre la récupération que les niveaux avaient rognée. */
function rendreRecup(pid,e){
  const k=wKey(pid,e), cur=getRest(pid,e);
  if(e.rest>0&&cur<e.rest){ DATA.rest[k]=Math.min(e.rest,cur+10); return "récupération rendue à "+DATA.rest[k]+" s"; }
  return null;
}

const levelOf=pid=>(DATA.level||{})[pid]||0;
const lastOf=pid=>DATA.history.filter(h=>h.id===pid)[0]||null;

function deleteSession(d){
  DATA.history=DATA.history.filter(h=>h.d!==d);
  DATA.deleted[d]=Date.now();
  DATA.deleted=trimDeleted(DATA.deleted);
  save();
}

/* =========================================================
   3. SON, VIBRATION, VEILLE
   ========================================================= */
let ac=null, wake=null, alarme=null;
function audioOn(){
  try{
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
  }catch(e){}
}
/* Fin de minuteur. Une sinusoïde est la forme d'onde qui porte le moins à
   volume égal : le téléphone posé au sol, à trois mètres, on ne l'entendait
   pas. Onde carrée doublée d'une octave, motif qui monte en fin de course, et
   surtout une répétition jusqu'à ce qu'on touche l'écran — plafonnée, pour ne
   pas sonner dans le vide si on a quitté la pièce. */
const MOTIF=[784,784,988,988,1175,1568];
const ALARME_CYCLES=3, ALARME_PAUSE=3200;
function sonnerie(){
  audioOn(); if(!ac) return;
  const t0=ac.currentTime+0.02;
  MOTIF.forEach((f,i)=>{
    const fin=i===MOTIF.length-1, t=t0+i*0.34, dur=fin?0.6:0.34;
    const g=ac.createGain(); g.connect(ac.destination);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(fin?0.5:0.38,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur-0.02);
    [["square",f,1],["sine",f*2,0.35]].forEach(([type,freq,part])=>{
      const o=ac.createOscillator(), gg=ac.createGain();
      o.type=type; o.frequency.value=freq; gg.gain.value=part;
      o.connect(gg); gg.connect(g);
      o.start(t); o.stop(t+dur);
    });
  });
  if(navigator.vibrate) navigator.vibrate([320,130,320,130,320,130,700]);
}
function alarmeDemarre(){
  alarmeArrete();
  let n=1; sonnerie();
  alarme=setInterval(()=>{ sonnerie(); if(++n>=ALARME_CYCLES) alarmeArrete(); },ALARME_PAUSE);
}
function alarmeArrete(){
  if(alarme){ clearInterval(alarme); alarme=null; }
  if(navigator.vibrate) navigator.vibrate(0);
}
/* Le téléphone relâche le verrou de lui-même dès que l'app passe en arrière-plan
   ou que l'écran s'éteint une fois. Le sentinel reste alors en main mais ne vaut
   plus rien : sans le test `released`, on croyait tenir le verrou et l'écran
   s'éteignait pour tout le reste de la séance. */
async function keepAwake(on){
  try{
    if(on&&(!wake||wake.released)&&navigator.wakeLock){
      wake=await navigator.wakeLock.request("screen");
      wake.addEventListener("release",()=>{ wake=null; });
    }
    if(!on&&wake){ const w=wake; wake=null; w.release(); }
  }catch(e){ wake=null; }
}

/* =========================================================
   4. TIMER
   ========================================================= */
/* La feuille se pose par-dessus la page. Sans réserve à sa hauteur, le bas de
   l'écran d'exercice — consignes, lien vidéo, molettes — passe dessous et aucun
   défilement ne le ramène : c'est la hauteur réelle qu'il faut mesurer, pas une
   valeur écrite en dur, puisque la feuille se replie. */
function reserverSousLaFeuille(){
  if(!appEl) return;
  const h=sheet.classList.contains("hidden")?0:sheet.offsetHeight;
  /* Le pied de séance est fixé au bas de l'écran, comme la feuille, et passait
     dessous : pendant une récupération, « Série validée », « Trop dur » et
     « Arrêter » étaient hors d'atteinte. Il se pose maintenant SUR la feuille. */
  const pied=view.querySelector(".foot");
  if(pied) pied.style.bottom = h ? h+"px" : "";
  appEl.style.paddingBottom = h ? (h+(pied?pied.offsetHeight:0)+24)+"px" : "";
}
/* Repli retenu d'une récup à l'autre, et même après un rafraîchissement : c'est
   une préférence d'affichage, elle vit à part de l'état de séance et ne passe
   donc ni par `merge()` ni par le serveur. */
const MINI_KEY="workout:mini";
let reduit=false;
try{ reduit=localStorage.getItem(MINI_KEY)==="1"; }catch(e){}
function appliquerReduction(){
  sheet.classList.toggle("mini",reduit);
  const b=el("t-reduce");
  if(b){
    b.setAttribute("aria-expanded",reduit?"false":"true");
    b.setAttribute("aria-label",reduit?"Agrandir le minuteur":"Réduire le minuteur");
  }
  requestAnimationFrame(reserverSousLaFeuille);
}
function basculerReduction(){
  reduit=!reduit;
  try{ localStorage.setItem(MINI_KEY,reduit?"1":"0"); }catch(e){}
  appliquerReduction();
}
const Timer={
  total:0,end:0,left:0,running:false,int:null,done:null,fired:false,
  start(sec,label,onDone){
    this.total=sec; this.left=sec; this.end=Date.now()+sec*1000;
    this.running=true; this.done=onDone; this.fired=false;
    el("t-label").textContent=label;
    peindreEnsuite();
    sheet.classList.remove("hidden","alarm");
    appliquerReduction();
    el("t-toggle").textContent="Pause";
    el("t-skip").textContent = label==="Récupération" ? "Passer la récup" : "Terminer";
    this.paint(); clearInterval(this.int);
    this.int=setInterval(()=>this.tick(),200);
  },
  tick(){
    if(!this.running) return;
    this.left=Math.max(0,(this.end-Date.now())/1000);
    this.paint();
    if(this.left<=0&&!this.fired){ this.fired=true; this.ring(); }
  },
  ring(){
    this.running=false; clearInterval(this.int);
    alarmeDemarre(); sheet.classList.add("alarm");
    el("t-label").textContent="Temps écoulé";
    el("t-skip").textContent="Continuer";
  },
  paint(){
    const s=Math.ceil(this.left);
    el("t-count").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
    el("t-fill").style.width=(this.total?Math.max(0,this.left/this.total)*100:0)+"%";
  },
  toggle(){
    if(this.fired) return;
    if(this.running){ this.running=false; this.left=Math.max(0,(this.end-Date.now())/1000); el("t-toggle").textContent="Reprendre"; }
    else { this.running=true; this.end=Date.now()+this.left*1000; el("t-toggle").textContent="Pause"; }
  },
  add(d){
    if(this.fired){ alarmeArrete(); this.fired=false; sheet.classList.remove("alarm"); el("t-label").textContent="Récupération"; el("t-skip").textContent="Passer la récup"; this.running=true; }
    this.left=Math.max(0,this.left+d); this.total=Math.max(this.total,this.left);
    if(this.running) this.end=Date.now()+this.left*1000;
    this.paint();
  },
  stop(){
    this.running=false; clearInterval(this.int); alarmeArrete();
    sheet.classList.add("hidden"); sheet.classList.remove("alarm");
    reserverSousLaFeuille();
    const cb=this.done; this.done=null; if(cb) cb();
  },
  /* referme le minuteur sans exécuter sa suite : pour quitter ou sauter un
     exercice pendant une récupération, sans faire avancer la séance au passage */
  cancel(){
    this.running=false; clearInterval(this.int); alarmeArrete(); this.done=null;
    sheet.classList.add("hidden"); sheet.classList.remove("alarm");
    reserverSousLaFeuille();
  }
};

/* =========================================================
   5. ÉTAT DE SÉANCE
   ========================================================= */
let S=null; // {p, i, set, log:[], t0}

/* La séance en cours est réécrite dans le stockage à chaque changement, et
   relue au démarrage : un rafraîchissement, un onglet fermé ou une app tuée par
   le téléphone ne coûtent plus rien. Seul « Arrêter » l'efface. Elle reste sur
   l'appareil : ni envoyée au serveur, ni fusionnée avec l'autre appareil. */
const REPRISE=12*3600*1000;   // au-delà, la séance est tenue pour abandonnée

function saveCur(){
  if(!S) return;
  DATA.cur={idx:S.idx, i:S.i, set:S.set, log:S.log, events:S.events,
            w:S.w, reps:S.reps, dur:S.dur, plan:S.plan,
            ecoule:Date.now()-S.t0, at:Date.now(), reposT0:S.reposT0||0,
            recup:(Timer.running&&!Timer.fired)?Timer.end:0};
  localSave();
}
function clearCur(){ DATA.cur=null; localSave(); }

function reprendre(){
  const c=DATA.cur;
  if(!c||c.idx==null) return false;
  const p=PROGRAM[c.idx];
  /* on ne reprend ni une séance d'un autre programme, ni une séance d'hier */
  if(!p||!Array.isArray(c.w)||c.w.length!==p.ex.length||Date.now()-(c.at||0)>REPRISE){
    DATA.cur=null; return false;
  }
  S={idx:c.idx, p, i:Math.min(c.i||0,p.ex.length-1), set:Math.max(1,c.set||1),
     log:c.log||[], events:c.events||[], w:c.w, reps:c.reps,
     dur:c.dur||p.ex.map(e=>getD(p.id,e)),
     plan:c.plan||p.ex.map(e=>({w:getW(p.id,e), r:getR(p.id,e), d:getD(p.id,e), rest:getRest(p.id,e)})),
     reposT0:c.reposT0||0, t0:Date.now()-(c.ecoule||0)};
  keepAwake(true);
  const reste=(c.recup||0)-Date.now();
  if(reste>1000) Timer.start(reste/1000,"Récupération",()=>{ noterRepos(); render(); });
  return true;
}

function startSession(idx){
  audioOn(); keepAwake(true);
  const p=PROGRAM[idx];
  /* `plan` fige l'objectif au moment où la séance commence : c'est lui, et non
     les réglages courants, qui sert de référence au récapitulatif. Les relire
     plus tard donnerait une comparaison qui bouge à chaque montée de niveau. */
  S={idx, p, i:0, set:1, log:[], events:[], t0:Date.now(),
     w:p.ex.map(e=>getW(p.id,e)), reps:p.ex.map(e=>getR(p.id,e)), dur:p.ex.map(e=>getD(p.id,e)),
     plan:p.ex.map(e=>({w:getW(p.id,e), r:getR(p.id,e), d:getD(p.id,e), rest:getRest(p.id,e)}))};
  render();
}

function curEx(){ return S.p.ex[S.i]; }

/* Une série validée fait avancer la séance une fois, tout de suite. La
   récupération ne fait que s'afficher par-dessus : sa fin ne rejoue pas
   l'avancement — c'est ce doublon qui faisait sauter une série sur deux. */
function validateSet(){
  const e=curEx(), i=S.i, pl=S.plan[i]||{};
  /* Toutes les séries sont inscrites, y compris l'échauffement et les exercices
     au temps : sans elles l'historique ne dit pas ce qui a été fait. Chacune
     porte le prévu ET le réalisé — c'est l'écart qui se lit ensuite, et il ne
     se reconstitue pas après coup. */
  S.log.push({
    n:e.n, t:e.type, load:e.load, side:!!e.side, uni:!!e.uni, part:e.part||0, set:S.set,
    w:S.w[i], r:S.reps[i],
    d:e.type==="time" ? Math.max(1,Math.round((Date.now()-(S.travailT0||Date.now()))/1000)) : null,
    pw:pl.w, pr:pl.r, pd:pl.d, prest:pl.rest, rest:null
  });
  S.travailT0=null;
  advance();
  if(S.i>=S.p.ex.length) return finish();   // dernier exercice : on termine ici
  const rest=getRest(S.p.id,e);
  if(rest>0){ S.reposT0=Date.now(); Timer.start(rest,"Récupération",()=>{ noterRepos(); render(); }); }
  render();
}
/* La récupération réellement prise appartient à la série qui la précède : elle
   n'est connue qu'à la fin du décompte, qu'il soit allé au bout, prolongé ou
   passé. Sans ça, « récup raccourcie » resterait un ressenti sans trace. */
function noterRepos(){
  if(!S||!S.reposT0) return;
  const d=S.log[S.log.length-1];
  if(d) d.rest=Math.max(0,Math.round((Date.now()-S.reposT0)/1000));
  S.reposT0=null;
}
function advance(){
  const e=curEx();
  if(S.set>=e.sets){ S.i++; S.set=1; } else S.set++;
}

/* La feuille recouvre le pied de séance : sans cette ligne, on regarde un
   décompte sans savoir s'il faut recharger la barre ou sortir les haltères. */
function peindreEnsuite(){
  const n=el("t-next"); if(!n) return;
  const e=S&&S.p.ex[S.i];
  if(!e){ n.className="ensuite vide"; return; }
  n.className="ensuite";
  /* au milieu d'un exercice, ce qui vient est une série de plus : répéter le nom
     n'apprendrait rien. C'est au changement d'exercice que l'information compte,
     parce qu'il faut recharger la barre ou sortir les haltères. */
  const suite = S.set>1
    ? {titre:`Série ${S.set} sur ${e.sets}`, detail:`${e.n} · ${paramsOf(S.p.id,e)}`}
    : {titre:e.n, detail:paramsOf(S.p.id,e)};
  n.innerHTML=`<div class="el">Ensuite</div><div class="en">${esc(suite.titre)}</div>
               <div class="ep">${esc(suite.detail)}</div>`;
}

function startWork(){
  const e=curEx();
  S.travailT0=Date.now();
  Timer.start(S.dur[S.i], e.n, validateSet);
}

/* Séance trop facile : un cran de plus, tout de suite. Les séries déjà
   inscrites dans le journal restent telles quelles — c'est ce qui a réellement
   été soulevé. Mais les charges de la séance sont toutes relevées, y compris
   celles des exercices passés : `finish()` les recopie dans `DATA.weights`, et
   laisser les anciennes valeurs annulerait la montée pour ces exercices-là. */
function harder(){
  const pid=S?S.p.id:null; if(!pid) return;
  const n=raiseLevel(pid);
  if(!n) return render();
  S.p.ex.forEach((e,i)=>{ S.w[i]=getW(pid,e); S.reps[i]=getR(pid,e); S.dur[i]=getD(pid,e); });
  S.events.push({at:Date.now(), t:"facile", i:S.i, n:curEx().n, quoi:"niveau "+n});
  toast("Niveau "+n+" : la suite de la séance est relevée");
  render();
}

/* Trop lourd ou trop long, maintenant : on descend l'exercice en cours et lui
   seul. L'effet est immédiat sur les séries restantes, et il est retenu — c'est
   un aveu utile, pas une faveur ponctuelle. Le récapitulatif le sait : un
   objectif abaissé exprès ne se compte pas comme un manque. */
function plusDur(){
  if(!S) return;
  const e=curEx(), quoi=lowerEx(S.p.id,e);
  if(!quoi) return toast("Cet exercice est déjà au plus bas");
  S.w[S.i]=getW(S.p.id,e); S.reps[S.i]=getR(S.p.id,e); S.dur[S.i]=getD(S.p.id,e);
  S.events.push({at:Date.now(), t:"dur", i:S.i, n:e.n, quoi});
  save();
  toast(e.n+" : "+quoi);
  render();
}

async function finish(){
  keepAwake(false); noterRepos();
  const mins=Math.max(1,Math.round((Date.now()-S.t0)/60000));
  /* « kg soulevés » reste la charge EXTERNE, barre et haltères : c'est le
     chiffre comparable avec les séances passées. La part du poids du corps se
     compte à part, dans `volumeCorps()`. */
  const vol=volumeExterne(S.log);
  const sets=S.log.filter(l=>l.load!=="none").length;
  const entree={d:Date.now(), id:S.p.id, name:S.p.name, mins, vol, sets,
                lvl:levelOf(S.p.id), log:S.log, events:S.events};
  DATA.history.unshift(entree);
  DATA.history=DATA.history.slice(0,60);
  S.p.ex.forEach((e,i)=>{ if(e.load==="bar"||e.load==="db") DATA.weights[wKey(S.p.id,e)]=S.w[i]; });
  DATA.nextIdx=(S.idx+1)%PROGRAM.length;
  DATA.cur=null;
  await save();
  S=null; renderDone(entree);
}

/* Progression d'un exercice d'une séance à l'autre. Une séance ne se compare
   qu'aux séances du même type : l'axe des colonnes est donc la suite des dates
   où CETTE séance a été faite, pas le calendrier.
   Chaque case porte ce qui se lit (répétitions, charge, durée) et, à part, un
   seul nombre comparable pour l'écart — le volume quand il y a une charge, le
   total de répétitions au poids du corps, les secondes sur un gainage. Mélanger
   les trois dans un même chiffre ne voudrait rien dire. */
const MAX_COL=4;   // au-delà, la table déborde sur un téléphone

function resumeEx(log,e){
  const series=(log||[]).filter(l=>l.n===e.n);
  if(!series.length) return null;
  if(e.type==="time"){
    const sec=series.reduce((a,l)=>a+(l.d!=null?l.d:(l.pd||e.dur||0)),0);
    return {val:sec, txt:series.length+"×"+Math.round(sec/series.length)+" s"};
  }
  const reps=series.reduce((a,l)=>a+(l.r||0)*(l.side?2:1),0);
  const w=series.reduce((a,l)=>Math.max(a,l.w||0),0);
  if(w>0) return {val:Math.round(w*reps), txt:series.length+"×"+(series[0].r||0)+"×"+fmt(w)+" kg"};
  return {val:reps, txt:series.length+"×"+(series[0].r||0)+" rép."};
}

function progression(){
  return PROGRAM.map(p=>{
    const seances=DATA.history.filter(h=>h.id===p.id).slice(0,MAX_COL);   // déjà du plus récent au plus ancien
    if(!seances.length) return null;
    const lignes=p.ex.filter(e=>e.load!=="none").map(e=>{
      const cases=seances.map(h=>resumeEx(h.log,e));
      const der=cases[0], prec=cases.slice(1).find(c=>c&&c.val);
      return {n:e.n, cases,
              ecart: der&&prec&&prec.val ? der.val/prec.val-1 : null};
    }).filter(l=>l.cases.some(c=>c));
    return lignes.length?{id:p.id, nom:p.name, dates:seances.map(h=>h.d), lignes}:null;
  }).filter(Boolean);
}

/* Réalisé contre prévu, exercice par exercice. La référence est l'objectif figé
   au DÉBUT de la séance et recopié dans chaque ligne du journal — pas les
   réglages d'aujourd'hui, qui donneraient une comparaison changeant à chaque
   montée de niveau.
   Les séances enregistrées avant que le prévu ne soit inscrit n'ont pas de
   référence : on reconstitue alors l'objectif à partir de la première série, et
   on ne compte que les exercices dont il reste une trace — plutôt que de faire
   passer pour un échec ce qui n'a simplement jamais été noté. */
function bilan(h){
  const p=PROGRAM.find(q=>q.id===h.id); if(!p||!h.log) return null;
  const complet=(h.log||[]).some(l=>l.t);
  const ajuste={};
  (h.events||[]).forEach(ev=>{ if(ev.t==="dur") ajuste[ev.n]=true; });
  const un=v=>v>0?v:1;
  const lignes=p.ex.filter(e=>e.load!=="none").map(e=>{
    const series=(h.log||[]).filter(l=>l.n===e.n), ref=series[0]||{};
    let fait=0, prevu=0, detail=[];
    if(e.type==="time"){
      const pd=ref.pd!=null?ref.pd:(e.dur||0);
      prevu=e.sets*pd;
      series.forEach(l=>{ const d=l.d!=null?l.d:pd; fait+=d; detail.push(d+" s"); });
    }else{
      const pr=ref.pr!=null?ref.pr:(e.reps||0);
      const pw=ref.pw!=null?ref.pw:(ref.w!=null?ref.w:0);
      prevu=e.sets*pr*un(pw);
      series.forEach(l=>{ const w=l.w!=null?l.w:pw; fait+=(l.r||0)*un(w);
        detail.push(w>0?`${l.r}×${fmt(w)} kg`:`${l.r}`); });
    }
    return {n:e.n, t:e.type, faites:series.length, sets:e.sets, prevu, detail,
            taux:prevu?fait/prevu:null, ajuste:!!ajuste[e.n],
            vide:!series.length};
  });
  /* Un objectif abaissé exprès en séance ne se compte pas comme un manque :
     sinon « Trop dur » punirait celui qui s'en sert honnêtement. */
  const comptes=lignes.filter(l=>l.taux!=null&&!l.ajuste&&(complet||!l.vide));
  const taux=comptes.length?comptes.reduce((a,l)=>a+l.taux,0)/comptes.length:null;
  return {lignes, taux, complet, ajustes:lignes.filter(l=>l.ajuste).length};
}
function motDuTaux(t){
  if(t==null) return "";
  if(t>=1.05) return "Au-dessus des objectifs";
  if(t>=1)    return "Objectifs atteints";
  if(t>=0.9)  return "Tout juste en dessous";
  return "En dessous des objectifs";
}

/* Part du poids du corps réellement déplacée. Les pieds au sol en reprennent
   une partie : environ un tiers aux pompes sur les mains, un peu plus de la
   moitié aux dips sur banc, talons près du corps. Ce sont des moyennes de
   population, pas une mesure : la longueur des segments et la position des
   pieds les déplacent, et c'est pour ça que le chiffre est présenté comme une
   estimation et tenu SÉPARÉ de la charge externe. Mêlés, les 1 800 kg de trois
   séries de pompes écraseraient la barre et rendraient l'historique
   incomparable du jour au lendemain.
   Le coefficient est relu dans le PROGRAMME quand le journal ne le porte pas :
   c'est ce qui rend le calcul rétroactif sur les séances déjà enregistrées. */
function exerciceParNom(n){
  for(const p of PROGRAM){ const e=p.ex.find(x=>x.n===n); if(e) return e; }
  return null;
}
function partDe(l){
  if(l.part!=null) return l.part;
  const e=exerciceParNom(l.n);
  return (e&&e.part)||0;
}
/* Poids du corps le plus proche AVANT la date donnée : une séance se compare au
   corps qu'on avait ce jour-là, pas à celui d'aujourd'hui. À défaut, la première
   mesure connue, faute de mieux — et rien du tout s'il n'y en a aucune. */
function poidsDuJour(t){
  const m=mesuresRetenues().filter(x=>x.kg!=null);
  if(!m.length) return null;
  const avant=m.filter(x=>x.d<=t);            // `mesuresRetenues` rend du plus récent au plus ancien
  return (avant.length?avant[0]:m[m.length-1]).kg;
}
function volumeCorps(log,t){
  const kg=poidsDuJour(t);
  if(kg==null) return null;
  let v=0, vu=false;
  (log||[]).forEach(l=>{
    const part=partDe(l);
    if(!part||l.t==="time") return;           // un gainage est isométrique : des kg×répétitions n'y veulent rien dire
    vu=true; v+=part*kg*(l.r||0)*(l.side?2:1);
  });
  return vu?Math.round(v):null;
}

/* Charge externe d'une séance : la barre compte une fois, les haltères deux —
   sauf un haltère unique tenu à deux mains, qui n'en fait qu'un. Les exercices
   au poids du corps n'y entrent pas : ils ont leur propre compte. */
function volumeExterne(log){
  let v=0;
  (log||[]).forEach(l=>{
    if(l.load!=="bar"&&l.load!=="db") return;
    const per=(l.load==="bar"||l.uni)?l.w:l.w*2;
    v+=per*(l.r||0)*(l.side?2:1);
  });
  return Math.round(v);
}

/* =========================================================
   Suivi corporel : trois petits graphiques plutôt qu'un seul.
   Poids (~80 kg), masse musculaire (~55 kg) et masse grasse (~15 kg) n'ont pas
   le même ordre de grandeur : sur un axe commun, les variations de poids — ce
   qu'on vient regarder — seraient écrasées à plat. Chaque mesure a donc son
   échelle, et l'axe du temps est partagé. Un seul tracé par cadre : le titre
   suffit à l'identifier, pas besoin de légende.
   ========================================================= */
/* Teintes revalidées sur le fond sombre : la palette d'origine, réglée pour le
   fond clair, y tombait à 2,4:1 de contraste. Celle-ci passe les six contrôles
   — bande de clarté, chroma, séparation daltonismes (ΔE 8,3 au pire), contraste
   — sur la surface #171A1F. Ne pas la changer sans revalider. */
const SERIES=[
  {k:"kg",     nom:"Poids",            court:"Poids",   u:"kg", c:"#4A90E2"},
  {k:"muscle", nom:"Masse musculaire", court:"Muscle",  u:"kg", c:"#BE7F28"},
  {k:"fat",    nom:"Masse grasse",     court:"Graisse", u:"kg", c:"#B75FAF"}
];
const kilo=v=>fmt(Number(v).toFixed(1));
const tonnes=v=>fmt((v/1000).toFixed(1))+" t";

/* Plage de temps affichée. Une seule commande, au-dessus de tout ce qu'elle
   régit : les quatre cadres et le tableau des périodes bougent ensemble. */
/* Trois mois par défaut : c'est la fenêtre où une variation de poids veut dire
   quelque chose. « Tout » remontait jusqu'aux pesées les plus anciennes et
   écrasait les dernières semaines contre le bord du cadre. */
let plage=90;  // en jours ; 0 = tout l'historique
const PLAGES=[[90,"3 mois"],[365,"1 an"],[0,"Tout"]];
/* La plage s'ancre sur l'événement le plus récent, mesure ou séance confondues,
   et s'applique aux deux : sinon l'axe se calerait sur les seules mesures et
   les barres d'entraînement déborderaient du cadre. */
function borneBasse(){
  if(!plage) return DATA.bodyFrom||0;
  const m=mesuresRetenues().sort((a,b)=>b.d-a.d)[0], h=(DATA.history||[])[0];
  const fin=Math.max(m?m.d:0, h?h.d:0);
  return fin-plage*86400000;
}
const surPlage=(liste,b0)=>(liste||[]).filter(x=>x.d>=b0);
const CH={w:320, h:96, x0:34, x1:312, haut:22, bas:80};
const SEM=7*86400000, BLOC=28*86400000;

/* Volume soulevé par semaine : c'est la trace de l'entraînement qu'on met en
   regard des mesures. On le compte en tonnes dès qu'il dépasse le millier. */
function parSemaine(seances,t0,t1){
  const sem=[];
  for(let t=t0;t<=t1;t+=SEM) sem.push({t, n:0, vol:0});
  (seances||[]).forEach(h=>{
    const i=Math.floor((h.d-t0)/SEM);
    if(i>=0&&i<sem.length){ sem[i].n++; sem[i].vol+=h.vol||0; }
  });
  return sem;
}

/* Mesure la plus proche d'une date, dans une fenêtre de dix jours. */
function mesureVers(mes,t){
  let best=null;
  mes.forEach(m=>{ if(Math.abs(m.d-t)<10*86400000 && (!best||Math.abs(m.d-t)<Math.abs(best.d-t))) best=m; });
  return best;
}

/* Périodes de quatre semaines : ce qui a été fait, et ce que les mesures ont
   bougé pendant ce temps. Aucune causalité n'est affirmée : c'est une mise en
   regard, que le tableau donne brute. */
function periodes(mes,seances){
  if(!mes.length) return [];
  const sc=seances||DATA.history||[];
  const fin=Math.max(mes[0].d, (sc[0]||{}).d||0);
  const debut=Math.min(mes[mes.length-1].d, (sc.slice(-1)[0]||{}).d||fin);
  const out=[];
  for(let t=fin; t>debut-BLOC; t-=BLOC){
    const a=t-BLOC, b=t;
    const ma=mesureVers(mes,a), mb=mesureVers(mes,b);
    const dedans=sc.filter(h=>h.d>a&&h.d<=b);
    const p={a, b, n:dedans.length, vol:dedans.reduce((x,h)=>x+(h.vol||0),0)};
    if(ma&&mb&&ma!==mb) SERIES.forEach(se=>{
      if(ma[se.k]!=null&&mb[se.k]!=null) p["d"+se.k]=Math.round((mb[se.k]-ma[se.k])*10)/10;
    });
    if(p.n||p.dkg!=null||p.dmuscle!=null) out.push(p);
  }
  return out;
}
const signe=v=>(v>0?"+":v<0?"−":"")+kilo(Math.abs(v));

/* Tendance récente, à afficher là où se décide le niveau de difficulté : une
   information, pas une consigne. L'app ne règle pas la difficulté d'après la
   balance — trop de choses entrent dans ces chiffres pour en tirer un ordre. */
function tendance(jours){
  const mes=mesuresRetenues().sort((a,b)=>b.d-a.d);
  if(mes.length<2) return null;
  const fin=mes[0], cible=fin.d-jours*86400000;
  const deb=mes.find(m=>m.d<=cible)||mes[mes.length-1];
  const j=Math.round((fin.d-deb.d)/86400000);
  /* la fenêtre doit rester proche de celle demandée : à défaut de mesure il y a
     deux mois, on se tait plutôt que d'annoncer une tendance « récente » qui
     remonterait en réalité à l'an dernier */
  if(deb===fin||j<14||j>jours*2) return null;
  const t={j}; let n=0;
  SERIES.forEach(se=>{
    if(fin[se.k]!=null&&deb[se.k]!=null){ t[se.k]=Math.round((fin[se.k]-deb[se.k])*10)/10; n++; }
  });
  return n?t:null;
}

/* Au-delà de six semaines sans mesure, on coupe le tracé : une droite tirée
   par-dessus un trou de plusieurs mois raconte une progression qui n'a pas été
   mesurée. */
const TROU=42*86400000;
function chemin(v,k,X,Y){
  let d="", prec=null;
  v.forEach(m=>{
    d+=(prec==null||m.d-prec>TROU?"M":"L")+X(m.d).toFixed(1)+" "+Y(m[k]).toFixed(1)+" ";
    prec=m.d;
  });
  return d.trim();
}

function courbes(mes,seances){
  const pts=mes.slice().sort((a,b)=>a.d-b.d);
  const sc=(seances||[]).slice().sort((a,b)=>a.d-b.d);
  /* l'axe couvre les deux sources : mesures et séances */
  const t0=Math.min(pts[0].d, sc.length?sc[0].d:pts[0].d);
  const t1=Math.max(pts[pts.length-1].d, sc.length?sc[sc.length-1].d:0);
  const dt=Math.max(1,t1-t0);
  const X=d=>CH.x0+(d-t0)/dt*(CH.x1-CH.x0);
  let out="";
  SERIES.forEach((se,n)=>{
    const top=n*CH.h, hi=top+CH.haut, lo=top+CH.bas;
    const v=pts.filter(m=>m[se.k]!=null);
    out+=`<text class="titre" x="0" y="${top+12}">${se.nom} <tspan fill="${se.c}">▬</tspan></text>`;
    if(v.length<2){
      out+=`<text class="ech" x="${CH.x0}" y="${(hi+lo)/2}">pas assez de mesures</text>`;
      return;
    }
    const vals=v.map(m=>m[se.k]);
    let mn=Math.min(...vals), mx=Math.max(...vals);
    const marge=(mx-mn)*0.12||0.5; mn-=marge; mx+=marge;
    const Y=y=>lo-(y-mn)/(mx-mn)*(lo-hi);
    out+=`<line class="regle" x1="${CH.x0}" y1="${hi}" x2="${CH.x1}" y2="${hi}"/>
          <line class="regle" x1="${CH.x0}" y1="${lo}" x2="${CH.x1}" y2="${lo}"/>
          <text class="ech" x="0" y="${hi+4}">${kilo(mx)}</text>
          <text class="ech" x="0" y="${lo+3}">${kilo(mn)}</text>
          <path class="trace" stroke="${se.c}" d="${chemin(v,se.k,X,Y)}"/>`;
    /* un point isolé entre deux trous ne se voit pas : on le pointe */
    v.forEach((m,i)=>{
      const seulAvant=i===0||m.d-v[i-1].d>TROU, seulApres=i===v.length-1||v[i+1].d-m.d>TROU;
      if(seulAvant&&seulApres&&i<v.length-1)
        out+=`<circle cx="${X(m.d).toFixed(1)}" cy="${Y(m[se.k]).toFixed(1)}" r="2" fill="${se.c}"/>`;
    });
    const der=v[v.length-1];
    out+=`<circle class="bout" cx="${X(der.d).toFixed(1)}" cy="${Y(der[se.k]).toFixed(1)}" r="3.6" fill="${se.c}"/>
          <text class="val" id="v-${se.k}" x="${CH.x1}" y="${top+13}">${kilo(der[se.k])} ${se.u}</text>`;
    out+=`<g class="pt-${se.k}" data-hi="${hi}" data-lo="${lo}" data-mn="${mn}" data-mx="${mx}"></g>`;
  });
  /* Quatrième cadre : l'entraînement, sur le même axe de temps. C'est là que se
     lit le lien avec les courbes du dessus — un coefficient calculé sur si peu
     de points donnerait un chiffre faussement précis. */
  const top=3*CH.h, hi=top+CH.haut, lo=top+CH.bas;
  const sem=parSemaine(sc,t0,t1);
  const volMax=Math.max(...sem.map(w=>w.vol),1);
  const larg=Math.min(26,Math.max(1.5,(CH.x1-CH.x0)/Math.max(1,sem.length)-2));
  out+=`<text class="titre" x="0" y="${top+12}">Entraînement <tspan fill="var(--steel)">par semaine</tspan></text>`;
  if(!sc.length){
    out+=`<text class="ech" x="${CH.x0}" y="${(hi+lo)/2}">aucune séance enregistrée pour l'instant</text>`;
  } else {
    out+=`<line class="regle" x1="${CH.x0}" y1="${lo}" x2="${CH.x1}" y2="${lo}"/>
          <text class="ech" x="0" y="${hi+4}">${tonnes(volMax)}</text>`;
    sem.forEach(w=>{
      if(!w.vol) return;
      const h=Math.max(1.5,(w.vol/volMax)*(lo-hi));
      const x=X(w.t), l=Math.min(larg,CH.x1-x);          // aucune barre ne dépasse du cadre
      if(l<0.5) return;
      out+=`<rect x="${x.toFixed(1)}" y="${(lo-h).toFixed(1)}" width="${l.toFixed(1)}" height="${h.toFixed(1)}" rx="1" fill="var(--ink)" opacity=".55"/>`;
    });
    const total=sc.reduce((a,h)=>a+(h.vol||0),0);
    out+=`<text class="val" x="${CH.x1}" y="${top+13}">${tonnes(total)}</text>`;
  }
  const base=4*CH.h;
  out+=`<text class="ech" x="${CH.x0}" y="${base+4}">${jour(t0)}</text>
        <text class="ech" x="${CH.x1}" y="${base+4}" text-anchor="end">${jour(t1)}</text>
        <line class="viseur" id="viseur" x1="0" y1="14" x2="0" y2="${base-10}" style="display:none"/>`;
  return `<svg class="courbes" viewBox="0 -4 ${CH.w} ${base+14}" id="cbs"
            data-t0="${t0}" data-t1="${t1}">${out}</svg>`;
}

/* La progression se lit d'une séance à l'autre du MÊME type : une table par
   séance, les dates en colonnes du plus ancien au plus récent, et l'écart avec
   la fois d'avant en dernière colonne. Pas de courbe ici : sur deux ou trois
   points, une ligne donnerait à une variation l'allure d'une tendance. */
function blocProgression(){
  const pr=progression();
  if(!pr.length) return `
    <div class="group-h">Progression par exercice</div>
    <div class="empty">Rien à comparer pour l'instant. La progression se lit d'une séance à l'autre du même type : il en faut deux. Elle se remplira toute seule.</div>`;
  const corps=DATA.history.map(h=>({d:h.d, v:volumeCorps(h.log,h.d)})).filter(x=>x.v!=null);
  return `<div class="group-h">Progression par exercice</div>`
  + pr.map(g=>`
    <div class="section-h">Séance ${g.id} · ${esc(g.nom)}</div>
    <div class="tab-wrap"><table class="tab"><thead><tr><th>Exercice</th>
      ${g.dates.slice().reverse().map(d=>`<th>${jour(d)}</th>`).join("")}<th>Δ</th></tr></thead>
    <tbody>${g.lignes.map(l=>`<tr><td>${esc(l.n)}</td>
      ${l.cases.slice().reverse().map(c=>`<td>${c?esc(c.txt):"—"}</td>`).join("")}
      <td>${l.ecart!=null?(l.ecart>0?"+":"")+Math.round(l.ecart*100)+" %":"—"}</td>
    </tr>`).join("")}</tbody></table></div>`).join("")
  + `<div class="empty" style="padding-top:14px">Δ compare la dernière séance à la précédente du même type, sur un seul nombre à la fois : le volume là où il y a une charge, le total de répétitions au poids du corps, les secondes tenues sur un gainage. Une case vide est un exercice passé ou pas encore enregistré.</div>`
  + (corps.length?`<div class="empty" style="padding-top:10px">Charge estimée du poids du corps, par séance : ${corps.slice(0,4).map(x=>`${jour(x.d)} ${x.v.toLocaleString("fr-FR")} kg`).join(" · ")}. Estimation, tenue à part des kg de barre et d'haltères.</div>`:"");
}

function readGear(){
  const g=DATA.gear, num=(id,d)=>{const v=parseFloat((el(id)||{}).value); return isNaN(v)?d:v;};
  g.bar=Math.max(1,num("g-bar",g.bar));
  g.dbBar=Math.max(0,num("g-dbbar",g.dbBar));
  document.querySelectorAll(".g-n").forEach(inp=>{
    const v=parseInt(inp.value,10); g.plates[+inp.dataset.i].n=isNaN(v)?0:Math.max(0,v);
  });
  g.plates=g.plates.filter(p=>p.n>0).sort((a,b)=>a.w-b.w);
  document.querySelectorAll(".g-dn").forEach(inp=>{
    const v=parseInt(inp.value,10); g.dbPlates[+inp.dataset.j].n=isNaN(v)?0:Math.max(0,v);
  });
  g.dbPlates=g.dbPlates.filter(p=>p.n>0).sort((a,b)=>a.w-b.w);
  if(el("s-url")) DATA.sync={url:el("s-url").value.trim().replace(/\/$/,""), key:el("s-key").value.trim()};
}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salle à la maison</title>
<meta name="theme-color" content="#E7E8E3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Séances">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<style>html,body{margin:0;padding:0;background:#E7E8E3;min-height:100%}</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <div id="timer-sheet" class="sheet hidden">
    <div class="sheet-inner">
      <div class="t-label" id="t-label">Récupération</div>
      <div class="t-count" id="t-count">01:30</div>
      <div class="t-bar"><span id="t-fill"></span></div>
      <div class="t-actions">
        <button class="ghost" id="t-minus">−15 s</button>
        <button class="ghost" id="t-toggle">Pause</button>
        <button class="ghost" id="t-plus">+15 s</button>
      </div>
      <button class="solid wide" id="t-skip">Passer la récup</button>
    </div>
  </div>
  <div id="toast"></div>
</div>

<style>
  :root{
    --concrete:#E7E8E3;
    --concrete-2:#DCDED7;
    --ink:#15171B;
    --ink-soft:#23262C;
    --steel:#767B80;
    --signal:#0F4FD8;
    --hot:#D93A1E;
    --line:rgba(21,23,27,.14);
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  #app{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:var(--concrete);
    min-height:100%;
    max-width:520px;
    margin:0 auto;
    padding:0 0 96px;
    position:relative;
    overflow-x:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  h1,h2,h3,p,ul{margin:0}

  /* ---------- header ---------- */
  .top{padding:26px 20px 18px;border-bottom:1px solid var(--line)}
  .top h1{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .top .sub{font-size:13px;color:var(--steel);margin-top:3px}

  /* ---------- home ---------- */
  .hero{padding:24px 20px 28px;border-bottom:1px solid var(--line)}
  .hero .kicker{font-size:13px;color:var(--steel)}
  .hero h2{font-size:40px;line-height:1.02;font-weight:800;letter-spacing:-.035em;margin-top:6px}
  .hero .focus{font-size:15px;color:var(--ink-soft);margin-top:10px;max-width:34ch;line-height:1.45}
  .meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:18px;font-size:13px;color:var(--steel)}
  .meta b{display:block;font-size:22px;color:var(--ink);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

  .cta{
    display:block;width:calc(100% - 40px);margin:20px;padding:19px;
    background:var(--ink);color:var(--concrete);border-radius:var(--r);
    font-size:17px;font-weight:700;letter-spacing:-.01em;text-align:center;
  }
  .cta:active{transform:translateY(1px)}

  .section{padding:6px 20px 0}
  .section-h{font-size:13px;color:var(--steel);padding:18px 0 10px}

  .row{
    display:flex;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--line);
    width:100%;text-align:left;
  }
  .row .tag{
    width:34px;height:34px;flex:none;border-radius:9px;background:var(--ink);color:var(--concrete);
    display:grid;place-items:center;font-weight:800;font-size:15px;
  }
  .row.next .tag{background:var(--signal)}
  .row .rt{flex:1;min-width:0}
  .row .rt strong{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .row .rt span{display:block;font-size:13px;color:var(--steel);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .go{font-size:13px;color:var(--steel)}

  .hist{border-top:1px solid var(--line);padding:14px 0;display:flex;gap:10px;align-items:baseline}
  .hist .d{font-size:13px;color:var(--steel);width:68px;flex:none;font-variant-numeric:tabular-nums}
  .hist .n{font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist .v{font-size:13px;color:var(--steel);font-variant-numeric:tabular-nums;flex:none}
  .empty{padding:30px 0 10px;color:var(--steel);font-size:14px;line-height:1.5;border-top:1px solid var(--line)}

  .pl{padding:11px 0;border-top:1px solid var(--line)}
  .pl .pn{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .pl .pp{display:block;font-size:13px;color:var(--steel);margin-top:3px;font-variant-numeric:tabular-nums}
  .pl.soft .pn{font-weight:600;color:var(--steel)}

  /* balayage vers la gauche sur une ligne d'historique */
  .swipe{position:relative;overflow:hidden}
  .swipe .hist{position:relative;z-index:1;background:var(--concrete);transition:transform .18s ease;touch-action:pan-y}
  .swipe.open .hist{transform:translateX(-108px)}
  .swipe-del{position:absolute;top:1px;right:0;bottom:0;width:108px;background:var(--hot);color:#fff;
             font-size:14px;font-weight:700;letter-spacing:-.01em}
  .hist .lvl{font-style:normal;font-size:12px;font-weight:600;color:var(--steel);flex:none}

  /* ---------- session ---------- */
  .prog{display:flex;gap:3px;padding:16px 20px 0}
  .prog i{height:3px;flex:1;background:var(--concrete-2);border-radius:2px}
  .prog i.done{background:var(--ink)}
  .prog i.now{background:var(--signal)}

  .exhead{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .exhead .idx{font-size:13px;color:var(--steel);font-variant-numeric:tabular-nums}
  .ex h2{padding:8px 20px 0;font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.03em}
  .ex .gear{padding:10px 20px 0;font-size:13px;color:var(--steel)}

  .sets{display:flex;gap:6px;padding:18px 20px 0;align-items:center}
  .sets i{width:26px;height:6px;border-radius:3px;background:var(--concrete-2)}
  .sets i.done{background:var(--ink)}
  .sets i.now{background:var(--signal)}
  .sets em{font-style:normal;font-size:13px;color:var(--steel);margin-left:6px}

  .fig{display:block;width:calc(100% - 40px);height:158px;margin:16px 20px 0;
       background:rgba(255,255,255,.45);border:1px solid var(--line);border-radius:var(--r);
       stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .fig .tete{fill:var(--ink);stroke:none}
  .fig .loin{opacity:.34}
  .fig .sol{stroke:rgba(21,23,27,.22);stroke-width:2}
  .fig .banc{stroke:var(--steel)}
  .fig .banc rect{fill:var(--steel);stroke:none}
  .fig .mat{stroke:var(--signal)}
  .fig .mat rect,.fig .mat circle{fill:var(--signal);stroke:none}
  .fig .band{stroke:var(--signal);stroke-width:2.2;stroke-dasharray:4 3}
  /* ---------- suivi corporel ---------- */
  .plages{display:flex;gap:8px;padding:14px 0 2px}
  .plages button{padding:7px 13px;border-radius:9px;background:var(--concrete-2);
                 font-size:13px;font-weight:600;color:var(--ink-soft)}
  .plages button.actif{background:var(--ink);color:var(--concrete)}
  .courbes{display:block;width:100%;margin-top:6px;overflow:visible;
           touch-action:pan-y;user-select:none;-webkit-user-select:none}
  .courbes .trace{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .courbes .bout{stroke:var(--concrete);stroke-width:2}
  .courbes .regle{stroke:var(--line);stroke-width:1}
  .courbes .titre{font:700 11px system-ui;fill:var(--ink)}
  .courbes .val{font:700 13px system-ui;fill:var(--ink);text-anchor:end}
  .courbes .ech{font:500 9px system-ui;fill:var(--steel)}
  .courbes .viseur{stroke:var(--ink);stroke-width:1;opacity:.45}
  .tab{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px;font-variant-numeric:tabular-nums}
  .tab th{font-size:12px;color:var(--steel);font-weight:600;text-align:right;padding:8px 0;border-bottom:1px solid var(--line)}
  .tab th:first-child{text-align:left}
  .tab td{text-align:right;padding:9px 0;border-top:1px solid var(--line);color:var(--ink-soft)}
  .tab td:first-child{text-align:left;color:var(--steel)}
  .pastille{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:1px}

  .video{display:block;margin:14px 20px 0;font-size:13px;color:var(--steel);
         text-decoration:underline;text-underline-offset:3px}

  .cues{margin:20px 20px 0;padding:16px 16px 16px 18px;background:rgba(21,23,27,.045);border-radius:var(--r)}
  .cues li{font-size:14px;line-height:1.5;color:var(--ink-soft);margin-bottom:7px;list-style:none;position:relative;padding-left:14px}
  .cues li:last-child{margin-bottom:0}
  .cues li:before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--steel)}

  .dials{display:flex;gap:12px;padding:20px 20px 0}
  .dial{flex:1;border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;text-align:center;background:rgba(255,255,255,.4)}
  .dial .dl{font-size:12px;color:var(--steel)}
  .dial .dv{font-size:27px;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
  .dial .dh{font-size:11px;color:var(--steel);min-height:14px;line-height:1.2}
  .dial .pm{display:flex;gap:8px;margin-top:10px}
  .dial .pm button{flex:1;height:38px;border-radius:9px;background:var(--concrete-2);font-size:19px;font-weight:700;line-height:1}
  .dial .pm button:active{background:var(--ink);color:var(--concrete)}

  .foot{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding:12px 20px 16px;
        background:linear-gradient(to top,var(--concrete) 72%,rgba(231,232,227,0));}
  .solid{display:block;width:100%;padding:18px;border-radius:var(--r);background:var(--ink);color:var(--concrete);font-size:17px;font-weight:700;text-align:center}
  .solid.blue{background:var(--signal)}
  .solid:active{transform:translateY(1px)}
  .under{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
  .under button{font-size:13px;color:var(--steel);padding:6px 2px;text-decoration:underline;text-underline-offset:3px}

  /* ---------- timer sheet ---------- */
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--ink);color:var(--concrete);
         border-radius:20px 20px 0 0;padding:22px 20px 24px;z-index:40;transition:transform .22s ease}
  .sheet.hidden{transform:translateY(105%)}
  .sheet.alarm{background:var(--hot)}
  .t-label{font-size:13px;opacity:.65}
  .t-count{font-size:68px;font-weight:800;letter-spacing:-.045em;line-height:1;margin:4px 0 14px;font-variant-numeric:tabular-nums}
  .t-bar{height:4px;background:rgba(231,232,227,.22);border-radius:2px;overflow:hidden}
  .t-bar span{display:block;height:100%;width:100%;background:var(--concrete);border-radius:2px}
  .t-actions{display:flex;gap:10px;margin:16px 0 12px}
  .ghost{flex:1;padding:13px;border-radius:11px;background:rgba(231,232,227,.14);color:var(--concrete);font-size:14px;font-weight:600}
  .sheet .solid{background:var(--concrete);color:var(--ink)}

  /* ---------- summary ---------- */
  .sum{padding:30px 20px 0}
  .sum h2{font-size:36px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
  .sum .grid{display:flex;gap:24px;margin:22px 0 4px;flex-wrap:wrap}
  .sum .grid div{font-size:13px;color:var(--steel)}
  .sum .grid b{display:block;font-size:28px;color:var(--ink);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .lines{margin-top:18px}
  .lines div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
  .lines span{color:var(--steel);font-variant-numeric:tabular-nums;flex:none}

  #toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,14px);background:var(--ink);color:var(--concrete);
         padding:11px 16px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:88%}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  .gline{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
  .gline label{flex:1;font-size:15px}
  .gline input{width:84px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.55);
               font:700 17px system-ui;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
  .gline em{font-style:normal;font-size:13px;color:var(--steel);width:52px}
  .gline .del{font-size:13px;color:var(--steel);text-decoration:underline;text-underline-offset:3px}
  .gline .add{padding:11px 14px;border-radius:10px;background:var(--ink);color:var(--concrete);font-size:14px;font-weight:600}
  .back{padding:22px 20px 0;font-size:13px;color:var(--steel)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px}
</style>

<script>
(function(){
"use strict";

/* =========================================================
   1. PROGRAMME
   Charges disponibles : barre olympique 20 kg + 2×5 + 2×7,5
   => 20 / 30 / 35 / 45 kg (chargement symétrique obligatoire)
   Haltères : 1 à 8 kg par haltère
   ========================================================= */
const DEFAULT_GEAR = {bar:20, plates:[{w:5,n:1},{w:7.5,n:1}], dbBar:2, dbMax:8, dbStep:2};
let BAR=[], BAR_HINT={}, DB=[];

/* toutes les charges atteignables en chargeant la barre symétriquement */
function buildLoads(){
  const g=DATA.gear, map={};
  (function rec(i,load,used){
    if(i>=g.plates.length){
      const k=Math.round(load*10)/10;
      const d=used.length?used.map(fmt).join(" + ")+" de chaque côté":"barre seule";
      if(!(k in map)||d.length<map[k].length) map[k]=d;
      return;
    }
    const p=g.plates[i];
    for(let c=0;c<=p.n;c++){
      const u=used.slice(); for(let j=0;j<c;j++) u.push(p.w);
      rec(i+1, load+2*p.w*c, u);
    }
  })(0,g.bar,[]);
  BAR=Object.keys(map).map(Number).sort((a,b)=>a-b);
  BAR_HINT=map;
  DB=[]; for(let k=0;k<=g.dbMax+1e-9;k+=g.dbStep) DB.push(Math.round((g.dbBar+k)*10)/10);
}

const PROGRAM = [
{
  id:"A", name:"Poussée",
  focus:"Pectoraux, épaules et triceps. Le développé couché ouvre la séance, tant que tu es frais.",
  ex:[
    {n:"Échauffement", type:"time", sets:1, dur:240, rest:0, load:"none",
     cues:["Cercles de bras, 20 en avant, 20 en arrière.","Élastique : 20 écartés devant la poitrine.","15 pompes lentes sur les genoux pour chauffer l'épaule.","2 séries de 8 au développé, barre à vide."]},
    {n:"Développé couché", type:"reps", sets:4, reps:8, rest:90, load:"bar", def:30,
     cues:["Omoplates serrées et bloquées dans le banc tout le long.","Descente en 2 s jusqu'au bas des pecs, remontée franche.","Pieds au sol, fesses en contact : pas de pont.","Sans pareur : garde 2 répétitions en réserve."]},
    {n:"Développé incliné haltères", type:"reps", sets:3, reps:10, rest:75, load:"db", def:9,
     cues:["Banc à 30–40°, pas plus, sinon ça devient une épaule.","Coudes à 45° du buste, poignets au-dessus des coudes.","Ne cogne pas les haltères en haut : garde la tension."]},
    {n:"Pompes sur poignées", type:"reps", sets:3, reps:12, rest:60, load:"bw",
     cues:["Descends plus bas que le sol, c'est tout l'intérêt des poignées.","Corps gainé en planche, bassin ni creusé ni levé.","Vise l'échec technique, pas l'échec total."]},
    {n:"Élévations latérales", type:"reps", sets:3, reps:12, rest:45, load:"db", def:4,
     cues:["Léger penché avant, coudes très légèrement fléchis.","Monte jusqu'à l'horizontale, pas plus haut.","Descente contrôlée en 2 s : c'est là que ça travaille."]},
    {n:"Dips sur banc", type:"reps", sets:3, reps:12, rest:45, load:"bw",
     cues:["Mains au bord du banc, doigts vers l'avant.","Descends jusqu'à 90° au coude, pas en dessous.","Pour durcir : talons posés loin, jambes tendues."]},
    {n:"Extension triceps élastique", type:"reps", sets:2, reps:15, rest:45, load:"band",
     cues:["Élastique coincé en hauteur ou derrière la nuque.","Coudes fixes et serrés, seuls les avant-bras bougent.","Bloque 1 s bras tendus."]},
    {n:"Roue abdominale", type:"reps", sets:3, reps:8, rest:45, load:"bw",
     cues:["À genoux sur le tapis, bassin rétroversé.","Va seulement aussi loin que tu peux garder le dos plat.","Si le bas du dos se creuse, tu es allé trop loin."]},
    {n:"Étirements", type:"time", sets:1, dur:120, rest:0, load:"none",
     cues:["Pecs à l'encadrement de porte, 30 s par côté.","Triceps bras derrière la tête, 30 s par côté."]}
  ]
},
{
  id:"B", name:"Tirage",
  focus:"Dos, biceps et gainage. Le rowing barre en ouverture, puis du travail unilatéral pour équilibrer.",
  ex:[
    {n:"Échauffement", type:"time", sets:1, dur:240, rest:0, load:"none",
     cues:["Cercles de bras et rotations du buste.","Élastique : 20 écartés + 20 tirages visage.","2 séries de 10 au rowing, barre à vide."]},
    {n:"Rowing barre buste penché", type:"reps", sets:4, reps:10, rest:90, load:"bar", def:30,
     cues:["Buste à ~45°, dos plat, genoux légèrement fléchis.","Tire la barre vers le nombril, coudes le long du corps.","Le buste ne se relève pas pendant la série.","Repose la barre au sol entre chaque série si le bas du dos chauffe."]},
    {n:"Rowing unilatéral haltère", type:"reps", sets:3, reps:12, rest:60, load:"db", def:10, side:true,
     cues:["Main et genou opposés en appui sur le banc.","Tire coude vers la hanche, pas vers l'épaule.","Épaules parallèles au sol : pas de rotation du buste.","12 répétitions d'un bras, puis 12 de l'autre."]},
    {n:"Pullover haltère", type:"reps", sets:3, reps:12, rest:60, load:"db", def:10,
     cues:["Allongé sur le banc plat, un haltère tenu à deux mains.","Descends derrière la tête bras quasi tendus, jusqu'à l'étirement.","Côtes basses : ne cambre pas pour aller plus loin."]},
    {n:"Tirage visage élastique", type:"reps", sets:3, reps:15, rest:45, load:"band",
     cues:["Élastique fixé à hauteur du visage.","Tire vers le front, coudes hauts et écartés.","Bloque 1 s omoplates serrées."]},
    {n:"Curl biceps haltères", type:"reps", sets:3, reps:12, rest:45, load:"db", def:8,
     cues:["Coudes collés au buste, pas d'élan de hanches.","Descente en 3 s, contrôle total.","Alterne bras par bras si la charge devient limite."]},
    {n:"Gainage planche", type:"time", sets:3, dur:40, rest:45, load:"bw",
     cues:["Appui sur les avant-bras, corps aligné talons-nuque.","Fesses serrées, nombril rentré.","Respire : ne bloque pas ta respiration."]},
    {n:"Étirements", type:"time", sets:1, dur:120, rest:0, load:"none",
     cues:["Grand dos : bras tendus en appui, fesses en arrière.","Biceps bras tendu contre un mur, 30 s par côté."]}
  ]
},
{
  id:"C", name:"Jambes",
  focus:"Chaîne postérieure, quadriceps et épaules. Charges plus lourdes, répétitions plus lentes.",
  ex:[
    {n:"Échauffement", type:"time", sets:1, dur:240, rest:0, load:"none",
     cues:["30 squats au poids du corps, lents.","20 fentes alternées sans charge.","2 séries de 8 au soulevé de terre, barre à vide."]},
    {n:"Soulevé de terre roumain", type:"reps", sets:4, reps:10, rest:90, load:"bar", def:45,
     cues:["Barre collée aux cuisses pendant toute la descente.","Genoux quasi tendus, bassin qui part en arrière.","Descends jusqu'à l'étirement des ischios, pas jusqu'au sol.","Dos plat : au moindre arrondi, tu remontes."]},
    {n:"Fente bulgare", type:"reps", sets:3, reps:10, rest:75, load:"db", def:10, side:true,
     cues:["Pied arrière sur le banc, pied avant à un grand pas.","Descends vertical, genou avant au-dessus du pied.","Un haltère dans chaque main, bras relâchés.","10 répétitions par jambe."]},
    {n:"Hip thrust", type:"reps", sets:3, reps:12, rest:75, load:"bar", def:45,
     cues:["Haut du dos sur le banc, barre sur le pli des hanches.","Pousse dans les talons, bassin jusqu'à l'alignement genoux-épaules.","Bloque 1 s en haut, fesses serrées.","Menton rentré : le regard suit le bassin."]},
    {n:"Développé militaire debout", type:"reps", sets:3, reps:8, rest:75, load:"bar", def:20,
     cues:["Monte les supports à hauteur de clavicules et désarme debout.","Mains un peu plus larges que les épaules, barre posée sur le haut des pecs.","Fesses et abdos serrés : pas de cambrure.","Tête qui recule légèrement au passage de la barre."]},
    {n:"Mollets debout", type:"reps", sets:3, reps:20, rest:40, load:"db", def:10,

/* durée estimée : travail + récup courante, hors transitions.
   Elle suit les objectifs courants, relevés par le niveau de difficulté,
   et doit rester sous 45 minutes : c'est ce que vérifie raiseLevel(). */
function estimate(p){
  let s=0;
  p.ex.forEach(e=>{
    const work = e.type==="time" ? getD(p.id,e) : getR(p.id,e)*3.5*(e.side?2:1);
    s += e.sets*(work+getRest(p.id,e));
  });
  return Math.round(s/60);
}

const L=(a,b)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;

function corps(c){
  let s="";
  if(c.g2) s+=`<g class="loin">${L(c.h,c.g2)}${L(c.g2,c.p2)}</g>`;
  if(c.c2) s+=`<g class="loin">${L(c.e,c.c2)}${L(c.c2,c.m2)}</g>`;
  s+=L(c.e,c.h);
  if(c.g) s+=L(c.h,c.g)+L(c.g,c.p);
  if(c.c) s+=L(c.e,c.c)+L(c.c,c.m);
  s+=`<circle cx="${c.t[0]}" cy="${c.t[1]}" r="5.5" class="tete"/>`;
  return s;
}

   <g transform="translate(${a[0]},${a[1]})">${d}</g><g transform="translate(${b[0]},${b[1]})">${d}</g></g>`;
}

/* Fusion de deux états. Les séances sont réunies par date (jamais perdues),
   sauf celles supprimées à la main : leur date reste inscrite dans `deleted`,
   sinon la copie de l'autre appareil les ferait revenir. Le reste vient du
   côté modifié le plus récemment. */
function trimDeleted(d){
  const out={};
  Object.keys(d).sort((x,y)=>y-x).slice(0,200).forEach(k=>out[k]=d[k]);
  return out;
}
function merge(a,b){
  const seen={}, dead=Object.assign({},a.deleted||{},b.deleted||{});
  [].concat(b.history||[],a.history||[]).forEach(s=>{ if(s&&s.d&&!seen[s.d]&&!dead[s.d]) seen[s.d]=s; });
  const newer=(a.updated||0)>=(b.updated||0)?a:b, older=newer===a?b:a;
  const both=k=>Object.assign({},older[k]||{},newer[k]||{});
  return {
    history:Object.keys(seen).map(k=>seen[k]).sort((x,y)=>y.d-x.d).slice(0,120),
    weights:both("weights"), reps:both("reps"), dur:both("dur"), rest:both("rest"), level:both("level"),
    deleted:trimDeleted(dead),
    body:fusionCorps(a.body,b.body),
    gear:newer.gear||older.gear,
    nextIdx:newer.nextIdx!=null?newer.nextIdx:0,
    updated:Math.max(a.updated||0,b.updated||0),
    sync:a.sync, syncedAt:a.syncedAt, cur:a.cur
  };
}

/* =========================================================
   2 ter. COMPOSITION CORPORELLE
   Mesures importées depuis un export de balance (Withings et compatibles).
   Une mesure par jour, la plus récente l'emporte ; tout est en kilos, sauf le
   taux de masse grasse, en pourcentage. Ces données suivent le même chemin que
   le reste : stockage local, et chiffrées si la sauvegarde en ligne est active.
   ========================================================= */
const jourDe=t=>new Date(t).toISOString().slice(0,10);

/* Une mesure par jour, la PREMIÈRE : on se pèse le matin à jeun, et une pesée
   du soir après le repas pèse un à deux kilos de plus. Garder la plus tardive
   ferait remonter la courbe pour une raison qui n'a rien à voir avec la forme. */
function fusionCorps(a,b){
  const par={};
  [].concat(b||[],a||[]).forEach(m=>{
    if(!m||!m.d) return;
    const k=jourDe(m.d);
    if(!par[k]||m.d<par[k].d) par[k]=m;
  });
  return Object.keys(par).map(k=>par[k]).sort((x,y)=>y.d-x.d).slice(0,2000);
}

/* Lecture d'un CSV. Le séparateur est déduit de la ligne d'entête et lui seul
   découpe : un export français sépare en points-virgules et écrit ses décimales
   en virgules, couper sur les deux briserait chaque nombre en deux. */
function delimDe(txt){
  const tete=(txt.split(/\r?\n/)[0]||"");
  let best=",", n=-1;
  [",",";","\t"].forEach(d=>{ const c=tete.split(d).length-1; if(c>n){ n=c; best=d; } });
  return best;
}
function lireCSV(txt){
  const sep=delimDe(txt), out=[];
  let champ="", ligne=[], guill=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(guill){
      if(c==='"'){ if(txt[i+1]==='"'){ champ+='"'; i++; } else guill=false; }
      else champ+=c;
    }
    else if(c==='"') guill=true;
    else if(c===sep){ ligne.push(champ); champ=""; }
    else if(c==="\n"){ ligne.push(champ); out.push(ligne); ligne=[]; champ=""; }
    else if(c!=="\r") champ+=c;
  }
  if(champ!==""||ligne.length){ ligne.push(champ); out.push(ligne); }
  return out.filter(l=>l.some(v=>v.trim()!==""));
}

/* Les entêtes varient selon la langue et la version de l'export : on les
   reconnaît par mots-clés, du plus précis au plus général. */
const sansAccent=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const normEntete=t=>sansAccent(t).replace(/\(.*?\)/g," ").replace(/[^a-z% ]+/g," ").replace(/\s+/g," ").trim();
const COLONNES=[
  ["fatpc", ["% masse grasse","taux de masse grasse","% graisse","fat percentage","fat ratio","body fat %"]],
  ["fat",   ["masse grasse","fat mass","graisse","gras","body fat"]],
  ["muscle",["masse musculaire","muscle mass","muscle"]],
  ["bone",  ["masse osseuse","bone mass"]],
  ["water", ["masse hydrique","hydratation","hydration","water"]],
  ["kg",    ["poids","weight"]],
  ["d",     ["date","time"]]
];
function nombreDe(v){
  const n=parseFloat(String(v).replace(",",".").replace(/[^0-9.\-]/g,""));
  return isNaN(n)?null:n;
}
function dateDe(v){
  const t=String(v).trim();
  let ms=Date.parse(t.replace(" ","T"));
  if(!isNaN(ms)) return ms;
  const fr=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})(?:\D+(\d{1,2}):(\d{2}))?/);
  if(fr) return new Date(+fr[3],+fr[2]-1,+fr[1],+(fr[4]||12),+(fr[5]||0)).getTime();
  return null;
}

/* Renvoie {mesures, colonnes} ou lève une erreur explicite. */
function lireBalance(txt){
  const lignes=lireCSV(txt);
  if(lignes.length<2) throw new Error("fichier vide");
  const entetes=lignes[0].map(normEntete), place={};
  entetes.forEach((h,i)=>{
    if(!h) return;
    for(const [cle,mots] of COLONNES){
      if(place[cle]!=null) continue;
      if(mots.some(m=>h===m||h.startsWith(m)||h.indexOf(m)>=0)){ place[cle]=i; return; }
    }
  });
  if(place.d==null) throw new Error("colonne de date introuvable");
  if(place.kg==null&&place.fat==null&&place.muscle==null) throw new Error("aucune mesure reconnue");
  const mesures=[];
  for(let i=1;i<lignes.length;i++){
    const l=lignes[i], d=dateDe(l[place.d]);
    if(!d) continue;
    const m={d};
    ["kg","fat","fatpc","muscle","bone","water"].forEach(k=>{
      if(place[k]!=null){ const v=nombreDe(l[place[k]]); if(v!=null&&v>0) m[k]=v; }
    });
    if(m.fatpc==null&&m.fat!=null&&m.kg) m.fatpc=Math.round(m.fat/m.kg*1000)/10;
    if(m.kg!=null||m.fat!=null||m.muscle!=null) mesures.push(m);
  }
  if(!mesures.length) throw new Error("aucune ligne lisible");
  return {mesures, colonnes:Object.keys(place).filter(k=>k!=="d")};
}

/* Chiffrement de bout en bout.
   La phrase saisie dans « Matériel » ne quitte jamais l'appareil. On en dérive
   deux valeurs distinctes, par deux sels différents :
   - un jeton d'authentification, envoyé au serveur : c'est lui qu'il faut
     donner à `wrangler secret put SYNC_KEY`, jamais la phrase ;
   - une clé AES-GCM, qui ne sort pas du navigateur.
   Le serveur ne stocke donc que des octets illisibles, et ne détient rien qui
   permette de les relire. Perdre la phrase, c'est perdre la sauvegarde : il
   n'existe aucun moyen de la récupérer, et c'est le prix du vrai chiffrement. */
const ROUNDS=210000;
let derived={phrase:null,keys:null};
const utf8=t=>new TextEncoder().encode(t);
function b64(buf){ let t=""; new Uint8Array(buf).forEach(c=>t+=String.fromCharCode(c)); return btoa(t); }
function unb64(t){ const bin=atob(t), a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }

async function derive(phrase){
  if(derived.phrase===phrase) return derived.keys;
  const sub=window.crypto&&window.crypto.subtle;
  if(!sub) throw new Error("chiffrement indisponible");
  const base=await sub.importKey("raw",utf8(phrase),"PBKDF2",false,["deriveBits","deriveKey"]);
  const rec=sel=>({name:"PBKDF2",salt:utf8(sel),iterations:ROUNDS,hash:"SHA-256"});
  const token=b64(await sub.deriveBits(rec("seances-jeton-v1"),base,256));
  const key=await sub.deriveKey(rec("seances-chiffre-v1"),base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  derived={phrase,keys:{token,key}};
  return derived.keys;
}
async function seal(obj,key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,utf8(JSON.stringify(obj)));
  return {v:1,alg:"AES-GCM",iv:b64(iv),ct:b64(ct)};
}
async function unseal(env,key){
  const clair=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(env.iv)},key,unb64(env.ct));
  return JSON.parse(new TextDecoder().decode(clair));
}

let syncing=false;
async function syncNow(silent){
  const s=DATA.sync;
  if(!s||!s.url||!s.key||syncing) return false;
  syncing=true;
  try{
    let k;
    try{ k=await derive(s.key); }
    catch(e){ if(!silent) toast("Chiffrement indisponible sur ce navigateur"); return false; }
    const head={authorization:"Bearer "+k.token};
    const r=await fetch(s.url,{headers:head,cache:"no-store"});
    if(r.status===401){ if(!silent) toast("Phrase refusée par le serveur"); return false; }
    if(!r.ok) throw new Error("get");
    const body=await r.json();
    let remote=null;
    if(body&&body.ct){
      try{ remote=await unseal(body,k.key); }
      catch(e){
        /* mauvaise phrase : on s'arrête avant d'écrire, sinon on écrase une
           sauvegarde encore bonne avec l'état de cet appareil. */
        if(!silent) toast("Sauvegarde illisible : ce n'est pas la bonne phrase");
        return false;
      }
    } else if(body&&body.history) remote=body; // sauvegarde d'avant le chiffrement
    if(remote&&remote.history) DATA=merge(DATA,remote);
    const payload=Object.assign({},DATA); delete payload.sync; delete payload.syncedAt; delete payload.cur;
    const p=await fetch(s.url,{method:"PUT",headers:Object.assign({"content-type":"application/json"},head),body:JSON.stringify(await seal(payload,k.key))});
    if(!p.ok) throw new Error("put");
    DATA.syncedAt=Date.now(); localSave();
    if(!silent) toast("Sauvegardé, chiffré");
    return true;
  }catch(e){
    if(!silent) toast("Serveur injoignable : les séances restent sur cet appareil");
    return false;
  }finally{ syncing=false; }
}
function exportData(){
  const b=new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="entrainement-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.history) throw 0;
      DATA=Object.assign(JSON.parse(JSON.stringify(BLANK)),d);
      if(!DATA.gear) DATA.gear=JSON.parse(JSON.stringify(DEFAULT_GEAR));
      buildLoads(); save(); render(); toast("Données importées");
    }catch(e){ toast("Fichier illisible : choisis un export de cette app"); }
  };
  r.readAsText(file);
}

const wKey=(pid,ex)=>pid+"|"+ex.n;
function getW(pid,ex){
  const v=(DATA.weights||{})[wKey(pid,ex)];
  if(v!=null) return v;
  return ex.def!=null?ex.def:0;
}
function getR(pid,ex){
  const v=(DATA.reps||{})[wKey(pid,ex)];
  return v!=null?v:(ex.reps||0);
}
function getD(pid,ex){
  const v=(DATA.dur||{})[wKey(pid,ex)];
  return v!=null?v:(ex.dur||0);
}
function getRest(pid,ex){
  const v=(DATA.rest||{})[wKey(pid,ex)];
  return v!=null?v:(ex.rest||0);
}
/* plancher de récupération : on ne descend pas sous 60 % du programme, ni sous 30 s */
const restFloor=ex=>Math.max(30,Math.round(ex.rest*0.6));
/* index de la charge la plus proche dans une liste composable */
function nearest(list,w){
  let k=list.indexOf(w);
  if(k<0){ k=0; list.forEach((v,j)=>{ if(Math.abs(v-w)<Math.abs(list[k]-w)) k=j; }); }
  return k;
}

/* =========================================================
   2 bis. NIVEAU DE DIFFICULTÉ
   Un niveau par séance (A, B, C), conservé d'une fois sur l'autre et inscrit
   dans l'historique. Monter d'un niveau suit une progression double : on ajoute
   des répétitions d'abord, et seulement une fois la marge atteinte on passe au
   cran de charge suivant en revenant aux répétitions de départ. C'est ce qui
   rend la montée raisonnable : jamais plus d'un cran, jamais une charge que la
   barre ne sait pas composer.
   ========================================================= */
/* Ces trois plafonds tiennent la séance sous 45 minutes. Une répétition en plus
   coûte du temps sur toutes les séries ; un cran de charge n'en coûte aucun.
   D'où une marge courte avant de charger, et des plafonds bas là où il n'y a
   rien à charger (poids du corps, élastique, gainage). */
const MARGE_REPS=1;    // répétitions gagnées avant de passer au cran de charge
const MAX_REPS=4;      // plafond au poids du corps, au-dessus de l'objectif
const MAX_DUR=20;      // plafond en secondes sur le gainage

/* Trois leviers, dans cet ordre : répétitions, puis charge, puis récupération.
   Quand la barre et les haltères sont au maximum de l'inventaire, il ne reste
   que la densité : raccourcir la récup durcit la séance et, contrairement aux
   répétitions, la raccourcit au lieu de l'allonger. */
function cutRest(pid,e){
  const k=wKey(pid,e), bas=restFloor(e), cur=getRest(pid,e);
  if(e.rest<=0||cur<=bas) return false;
  DATA.rest[k]=Math.max(bas,cur-5);
  return true;
}

function levelUp(pid){
  const p=PROGRAM.find(q=>q.id===pid); if(!p) return 0;
  p.ex.forEach(e=>{
    const k=wKey(pid,e);
    if(e.load==="none") return;                       // échauffement, étirements
    if(e.type==="time"){
      if(getD(pid,e)<(e.dur||0)+MAX_DUR) DATA.dur[k]=getD(pid,e)+5;
      else cutRest(pid,e);
      return;
    }
    if(e.load==="bar"||e.load==="db"){
      const cur=getR(pid,e);
      if(cur<(e.reps||0)+MARGE_REPS){ DATA.reps[k]=cur+1; return; }
      const list=e.load==="bar"?BAR:DB, i=nearest(list,getW(pid,e));
      if(i<list.length-1){ DATA.weights[k]=list[i+1]; DATA.reps[k]=e.reps; return; }
      if(cur<(e.reps||0)+MAX_REPS){ DATA.reps[k]=cur+1; return; }  // déjà au plus lourd
      cutRest(pid,e);
      return;
    }
    if(getR(pid,e)<(e.reps||0)+MAX_REPS) DATA.reps[k]=getR(pid,e)+1;  // poids du corps, élastique
    else cutRest(pid,e);
  });
  DATA.level[pid]=(DATA.level[pid]||0)+1;
  return DATA.level[pid];
}

/* Applique un niveau en tenant le budget de 45 minutes. Si la montée déborde,
   on la paie en récupération, seul levier qui durcit la séance en la
   raccourcissant. Et si même là ça ne rentre plus, on revient en arrière
   plutôt que d'allonger la séance. */
function raiseLevel(pid){
  const p=PROGRAM.find(q=>q.id===pid); if(!p) return 0;
  const avant=JSON.stringify({w:DATA.weights,r:DATA.reps,d:DATA.dur,t:DATA.rest,l:DATA.level});
  const empreinte=()=>JSON.stringify(p.ex.map(e=>[getW(pid,e),getR(pid,e),getD(pid,e),getRest(pid,e)]));
  const depart=empreinte();
  const n=levelUp(pid);
  while(estimate(p)>45){
    const e=p.ex.filter(x=>x.rest>0&&getRest(pid,x)>restFloor(x))
                .sort((a,b)=>getRest(pid,b)-getRest(pid,a))[0];
    if(!e) break;
    cutRest(pid,e);
  }
  const bloque = estimate(p)>45, fige = empreinte()===depart;
  if(bloque||fige){
    const v=JSON.parse(avant);
    DATA.weights=v.w; DATA.reps=v.r; DATA.dur=v.d; DATA.rest=v.t; DATA.level=v.l;
    toast(bloque ? "Séance déjà à 45 minutes : impossible d'en ajouter"
                 : "Maximum atteint avec ce matériel : ajoute un disque dans Matériel");
    return 0;
  }
  save();
  return n;
}
const levelOf=pid=>(DATA.level||{})[pid]||0;
const lastOf=pid=>DATA.history.filter(h=>h.id===pid)[0]||null;

function deleteSession(d){
  DATA.history=DATA.history.filter(h=>h.d!==d);
  DATA.deleted[d]=Date.now();
  DATA.deleted=trimDeleted(DATA.deleted);
  save();
}

/* =========================================================
   3. SON, VIBRATION, VEILLE
   ========================================================= */
let ac=null, wake=null;
function audioOn(){
  try{
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
  }catch(e){}
}
function beep(n){
  audioOn(); if(!ac) return;
  const t0=ac.currentTime;
  for(let i=0;i<n;i++){
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type="sine"; o.frequency.value = i===n-1?1046:784;
    const t=t0+i*0.28;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.35,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
    o.start(t); o.stop(t+0.26);
  }
  if(navigator.vibrate) navigator.vibrate([250,120,250,120,450]);
}
async function keepAwake(on){
  try{
    if(on&&!wake&&navigator.wakeLock) wake=await navigator.wakeLock.request("screen");
    if(!on&&wake){ wake.release(); wake=null; }
  }catch(e){}
}

/* =========================================================
   4. TIMER
   ========================================================= */
const Timer={
  total:0,end:0,left:0,running:false,int:null,done:null,fired:false,
  start(sec,label,onDone){
    this.total=sec; this.left=sec; this.end=Date.now()+sec*1000;
    this.running=true; this.done=onDone; this.fired=false;
    el("t-label").textContent=label;
    sheet.classList.remove("hidden","alarm");
    el("t-toggle").textContent="Pause";
    el("t-skip").textContent = label==="Récupération" ? "Passer la récup" : "Terminer";
    this.paint(); clearInterval(this.int);
    this.int=setInterval(()=>this.tick(),200);
  },
  tick(){
    if(!this.running) return;
    this.left=Math.max(0,(this.end-Date.now())/1000);
    this.paint();
    if(this.left<=0&&!this.fired){ this.fired=true; this.ring(); }
  },
  ring(){
    this.running=false; clearInterval(this.int);
    beep(3); sheet.classList.add("alarm");
    el("t-label").textContent="Temps écoulé";
    el("t-skip").textContent="Continuer";
  },
  paint(){
    const s=Math.ceil(this.left);
    el("t-count").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
    el("t-fill").style.width=(this.total?Math.max(0,this.left/this.total)*100:0)+"%";
  },
  toggle(){
    if(this.fired) return;
    if(this.running){ this.running=false; this.left=Math.max(0,(this.end-Date.now())/1000); el("t-toggle").textContent="Reprendre"; }
    else { this.running=true; this.end=Date.now()+this.left*1000; el("t-toggle").textContent="Pause"; }
  },
  add(d){
    if(this.fired){ this.fired=false; sheet.classList.remove("alarm"); el("t-label").textContent="Récupération"; el("t-skip").textContent="Passer la récup"; this.running=true; }
    this.left=Math.max(0,this.left+d); this.total=Math.max(this.total,this.left);
    if(this.running) this.end=Date.now()+this.left*1000;
    this.paint();
  },
  stop(){
    this.running=false; clearInterval(this.int);
    sheet.classList.add("hidden"); sheet.classList.remove("alarm");
    const cb=this.done; this.done=null; if(cb) cb();
  },
  /* referme le minuteur sans exécuter sa suite : pour quitter ou sauter un
     exercice pendant une récupération, sans faire avancer la séance au passage */
  cancel(){
    this.running=false; clearInterval(this.int); this.done=null;
    sheet.classList.add("hidden"); sheet.classList.remove("alarm");
  }
};

/* =========================================================
   5. ÉTAT DE SÉANCE
   ========================================================= */
let S=null; // {p, i, set, log:[], t0}

/* La séance en cours est réécrite dans le stockage à chaque changement, et
   relue au démarrage : un rafraîchissement, un onglet fermé ou une app tuée par
   le téléphone ne coûtent plus rien. Seul « Arrêter » l'efface. Elle reste sur
   l'appareil : ni envoyée au serveur, ni fusionnée avec l'autre appareil. */
const REPRISE=12*3600*1000;   // au-delà, la séance est tenue pour abandonnée

function saveCur(){
  if(!S) return;
  DATA.cur={idx:S.idx, i:S.i, set:S.set, log:S.log, w:S.w, reps:S.reps,
            ecoule:Date.now()-S.t0, at:Date.now(),
            recup:(Timer.running&&!Timer.fired)?Timer.end:0};
  localSave();
}
function clearCur(){ DATA.cur=null; localSave(); }

function reprendre(){
  const c=DATA.cur;
  if(!c||c.idx==null) return false;
  const p=PROGRAM[c.idx];
  /* on ne reprend ni une séance d'un autre programme, ni une séance d'hier */
  if(!p||!Array.isArray(c.w)||c.w.length!==p.ex.length||Date.now()-(c.at||0)>REPRISE){
    DATA.cur=null; return false;
  }
  S={idx:c.idx, p, i:Math.min(c.i||0,p.ex.length-1), set:Math.max(1,c.set||1),
     log:c.log||[], w:c.w, reps:c.reps, t0:Date.now()-(c.ecoule||0)};
  keepAwake(true);
  const reste=(c.recup||0)-Date.now();
  if(reste>1000) Timer.start(reste/1000,"Récupération",render);
  return true;
}

function startSession(idx){
  audioOn(); keepAwake(true);
  const p=PROGRAM[idx];
  S={idx, p, i:0, set:1, log:[], t0:Date.now(),
     w:p.ex.map(e=>getW(p.id,e)), reps:p.ex.map(e=>getR(p.id,e))};
  render();
}

function curEx(){ return S.p.ex[S.i]; }

/* Une série validée fait avancer la séance une fois, tout de suite. La
   récupération ne fait que s'afficher par-dessus : sa fin ne rejoue pas
   l'avancement — c'est ce doublon qui faisait sauter une série sur deux. */
function validateSet(){
  const e=curEx();
  if(e.type==="reps"&&e.load!=="none"){
    S.log.push({n:e.n, w:S.w[S.i], r:S.reps[S.i], load:e.load, side:!!e.side});
  }
  advance();
  if(S.i>=S.p.ex.length) return finish();   // dernier exercice : on termine ici
  const rest=getRest(S.p.id,e);
  if(rest>0) Timer.start(rest,"Récupération",render);
  render();
}
function advance(){
  const e=curEx();
  if(S.set>=e.sets){ S.i++; S.set=1; } else S.set++;
}

function startWork(){
  const e=curEx();
  Timer.start(getD(S.p.id,e), e.n, validateSet);
}

/* Séance trop facile : un cran de plus, tout de suite. Les séries déjà
   inscrites dans le journal restent telles quelles — c'est ce qui a réellement
   été soulevé. Mais les charges de la séance sont toutes relevées, y compris
   celles des exercices passés : `finish()` les recopie dans `DATA.weights`, et
   laisser les anciennes valeurs annulerait la montée pour ces exercices-là. */
function harder(){
  const pid=S?S.p.id:null; if(!pid) return;
  const n=raiseLevel(pid);
  if(!n) return render();
  S.p.ex.forEach((e,i)=>{ S.w[i]=getW(pid,e); S.reps[i]=getR(pid,e); });
  toast("Niveau "+n+" : la suite de la séance est relevée");
  render();
}

async function finish(){
  keepAwake(false);
  const mins=Math.max(1,Math.round((Date.now()-S.t0)/60000));
  let vol=0, sets=0;
  S.log.forEach(l=>{
    sets++;
    const per = l.load==="bar" ? l.w : l.w*2;
    vol += per*l.r*(l.side?2:1);
  });
  DATA.history.unshift({d:Date.now(), id:S.p.id, name:S.p.name, mins, vol:Math.round(vol), sets, lvl:levelOf(S.p.id), log:S.log});
  DATA.history=DATA.history.slice(0,60);
  S.p.ex.forEach((e,i)=>{ if(e.load==="bar"||e.load==="db") DATA.weights[wKey(S.p.id,e)]=S.w[i]; });
  DATA.nextIdx=(S.idx+1)%PROGRAM.length;
  DATA.cur=null;
  await save();
  const done={mins,vol:Math.round(vol),sets,name:S.p.name,id:S.p.id,log:S.log};
  S=null; renderDone(done);
}

const fmt=n=>String(n).replace(".",",");

function toast(m){
  const t=el("toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("show"),2600);
}

function weekCount(){
  const now=new Date(), day=(now.getDay()+6)%7;
  const mon=new Date(now); mon.setHours(0,0,0,0); mon.setDate(now.getDate()-day);
  return DATA.history.filter(h=>h.d>=mon.getTime()).length;
}

/* Le programme est hebdomadaire : une semaine sans séance repart de A, plutôt
   que de mettre en avant la B ou la C laissées en cours la semaine d'avant. */
function nextSession(){
  return weekCount()===0 ? 0 : DATA.nextIdx%PROGRAM.length;
}

/* Paramètres tels qu'ils seront proposés, niveau de difficulté compris. */
const duree=s=>s>=60 ? (s%60 ? Math.floor(s/60)+" min "+(s%60) : Math.round(s/60)+" min") : s+" s";
function paramsOf(pid,e){
  if(e.type==="time") return (e.sets>1?e.sets+" × ":"")+duree(getD(pid,e));
  const charge={bar:fmt(getW(pid,e))+" kg",
                db:fmt(getW(pid,e))+" kg par haltère",
                bw:"poids du corps", band:"élastique"}[e.load];
  const rec=getRest(pid,e);
  return e.sets+" × "+getR(pid,e)+(e.side?" par côté":"")+
         (charge?" · "+charge:"")+(rec?" · récup "+duree(rec):"");
}

    ${isTime
      ? (()=>{ const d=getD(p.id,e);
          return `<button class="solid blue" id="go">Démarrer · ${Math.floor(d/60)>0?Math.floor(d/60)+" min":""}${d%60?(Math.floor(d/60)?" ":"")+(d%60)+" s":""}</button>`; })()
      : `<button class="solid" id="go">Série validée</button>`}

      <button id="prev" ${i===0&&S.set===1?"style='visibility:hidden'":""}>Revenir en arrière</button>

/* =========================================================
   Suivi corporel : trois petits graphiques plutôt qu'un seul.
   Poids (~80 kg), masse musculaire (~55 kg) et masse grasse (~15 kg) n'ont pas
   le même ordre de grandeur : sur un axe commun, les variations de poids — ce
   qu'on vient regarder — seraient écrasées à plat. Chaque mesure a donc son
   échelle, et l'axe du temps est partagé. Un seul tracé par cadre : le titre
   suffit à l'identifier, pas besoin de légende.
   ========================================================= */
const SERIES=[
  {k:"kg",     nom:"Poids",            court:"Poids",   u:"kg", c:"#0F4FD8"},
  {k:"muscle", nom:"Masse musculaire", court:"Muscle",  u:"kg", c:"#BF6A00"},
  {k:"fat",    nom:"Masse grasse",     court:"Graisse", u:"kg", c:"#8A2F86"}
];
const kilo=v=>fmt(Number(v).toFixed(1));
const tonnes=v=>fmt((v/1000).toFixed(1))+" t";

/* Plage de temps affichée. Une seule commande, au-dessus de tout ce qu'elle
   régit : les quatre cadres et le tableau des périodes bougent ensemble. */
let plage=0;   // en jours ; 0 = tout l'historique
const PLAGES=[[90,"3 mois"],[365,"1 an"],[0,"Tout"]];
/* La plage s'ancre sur l'événement le plus récent, mesure ou séance confondues,
   et s'applique aux deux : sinon l'axe se calerait sur les seules mesures et
   les barres d'entraînement déborderaient du cadre. */
function borneBasse(){
  if(!plage) return 0;
  const m=(DATA.body||[])[0], h=(DATA.history||[])[0];
  const fin=Math.max(m?m.d:0, h?h.d:0);
  return fin-plage*86400000;
}
const surPlage=(liste,b0)=>(liste||[]).filter(x=>x.d>=b0);
const CH={w:320, h:96, x0:34, x1:312, haut:22, bas:80};
const SEM=7*86400000, BLOC=28*86400000;

/* Volume soulevé par semaine : c'est la trace de l'entraînement qu'on met en
   regard des mesures. On le compte en tonnes dès qu'il dépasse le millier. */
function parSemaine(seances,t0,t1){
  const sem=[];
  for(let t=t0;t<=t1;t+=SEM) sem.push({t, n:0, vol:0});
  (seances||[]).forEach(h=>{
    const i=Math.floor((h.d-t0)/SEM);
    if(i>=0&&i<sem.length){ sem[i].n++; sem[i].vol+=h.vol||0; }
  });
  return sem;
}

/* Mesure la plus proche d'une date, dans une fenêtre de dix jours. */
function mesureVers(mes,t){
  let best=null;
  mes.forEach(m=>{ if(Math.abs(m.d-t)<10*86400000 && (!best||Math.abs(m.d-t)<Math.abs(best.d-t))) best=m; });
  return best;
}

/* Périodes de quatre semaines : ce qui a été fait, et ce que les mesures ont
   bougé pendant ce temps. Aucune causalité n'est affirmée : c'est une mise en
   regard, que le tableau donne brute. */
function periodes(mes,seances){
  if(!mes.length) return [];
  const sc=seances||DATA.history||[];
  const fin=Math.max(mes[0].d, (sc[0]||{}).d||0);
  const debut=Math.min(mes[mes.length-1].d, (sc.slice(-1)[0]||{}).d||fin);
  const out=[];
  for(let t=fin; t>debut-BLOC; t-=BLOC){
    const a=t-BLOC, b=t;
    const ma=mesureVers(mes,a), mb=mesureVers(mes,b);
    const dedans=sc.filter(h=>h.d>a&&h.d<=b);
    const p={a, b, n:dedans.length, vol:dedans.reduce((x,h)=>x+(h.vol||0),0)};
    if(ma&&mb&&ma!==mb) SERIES.forEach(se=>{
      if(ma[se.k]!=null&&mb[se.k]!=null) p["d"+se.k]=Math.round((mb[se.k]-ma[se.k])*10)/10;
    });
    if(p.n||p.dkg!=null||p.dmuscle!=null) out.push(p);
  }
  return out;
}
const signe=v=>(v>0?"+":v<0?"−":"")+kilo(Math.abs(v));

/* Tendance récente, à afficher là où se décide le niveau de difficulté : une
   information, pas une consigne. L'app ne règle pas la difficulté d'après la
   balance — trop de choses entrent dans ces chiffres pour en tirer un ordre. */
function tendance(jours){
  const mes=(DATA.body||[]).slice().sort((a,b)=>b.d-a.d);
  if(mes.length<2) return null;
  const fin=mes[0], cible=fin.d-jours*86400000;
  const deb=mes.find(m=>m.d<=cible)||mes[mes.length-1];
  const j=Math.round((fin.d-deb.d)/86400000);
  /* la fenêtre doit rester proche de celle demandée : à défaut de mesure il y a
     deux mois, on se tait plutôt que d'annoncer une tendance « récente » qui
     remonterait en réalité à l'an dernier */
  if(deb===fin||j<14||j>jours*2) return null;
  const t={j}; let n=0;
  SERIES.forEach(se=>{
    if(fin[se.k]!=null&&deb[se.k]!=null){ t[se.k]=Math.round((fin[se.k]-deb[se.k])*10)/10; n++; }
  });
  return n?t:null;
}

/* Au-delà de six semaines sans mesure, on coupe le tracé : une droite tirée
   par-dessus un trou de plusieurs mois raconte une progression qui n'a pas été
   mesurée. */
const TROU=42*86400000;
function chemin(v,k,X,Y){
  let d="", prec=null;
  v.forEach(m=>{
    d+=(prec==null||m.d-prec>TROU?"M":"L")+X(m.d).toFixed(1)+" "+Y(m[k]).toFixed(1)+" ";
    prec=m.d;
  });
  return d.trim();
}

function courbes(mes,seances){
  const pts=mes.slice().sort((a,b)=>a.d-b.d);
  const sc=(seances||[]).slice().sort((a,b)=>a.d-b.d);
  /* l'axe couvre les deux sources : mesures et séances */
  const t0=Math.min(pts[0].d, sc.length?sc[0].d:pts[0].d);
  const t1=Math.max(pts[pts.length-1].d, sc.length?sc[sc.length-1].d:0);
  const dt=Math.max(1,t1-t0);
  const X=d=>CH.x0+(d-t0)/dt*(CH.x1-CH.x0);
  let out="";
  SERIES.forEach((se,n)=>{
    const top=n*CH.h, hi=top+CH.haut, lo=top+CH.bas;
    const v=pts.filter(m=>m[se.k]!=null);
    out+=`<text class="titre" x="0" y="${top+12}">${se.nom} <tspan fill="${se.c}">▬</tspan></text>`;
    if(v.length<2){
      out+=`<text class="ech" x="${CH.x0}" y="${(hi+lo)/2}">pas assez de mesures</text>`;
      return;
    }
    const vals=v.map(m=>m[se.k]);
    let mn=Math.min(...vals), mx=Math.max(...vals);
    const marge=(mx-mn)*0.12||0.5; mn-=marge; mx+=marge;
    const Y=y=>lo-(y-mn)/(mx-mn)*(lo-hi);
    out+=`<line class="regle" x1="${CH.x0}" y1="${hi}" x2="${CH.x1}" y2="${hi}"/>
          <line class="regle" x1="${CH.x0}" y1="${lo}" x2="${CH.x1}" y2="${lo}"/>
          <text class="ech" x="0" y="${hi+4}">${kilo(mx)}</text>
          <text class="ech" x="0" y="${lo+3}">${kilo(mn)}</text>
          <path class="trace" stroke="${se.c}" d="${chemin(v,se.k,X,Y)}"/>`;
    /* un point isolé entre deux trous ne se voit pas : on le pointe */
    v.forEach((m,i)=>{
      const seulAvant=i===0||m.d-v[i-1].d>TROU, seulApres=i===v.length-1||v[i+1].d-m.d>TROU;
      if(seulAvant&&seulApres&&i<v.length-1)
        out+=`<circle cx="${X(m.d).toFixed(1)}" cy="${Y(m[se.k]).toFixed(1)}" r="2" fill="${se.c}"/>`;
    });
    const der=v[v.length-1];
    out+=`<circle class="bout" cx="${X(der.d).toFixed(1)}" cy="${Y(der[se.k]).toFixed(1)}" r="3.6" fill="${se.c}"/>
          <text class="val" id="v-${se.k}" x="${CH.x1}" y="${top+13}">${kilo(der[se.k])} ${se.u}</text>`;
    out+=`<g class="pt-${se.k}" data-hi="${hi}" data-lo="${lo}" data-mn="${mn}" data-mx="${mx}"></g>`;
  });
  /* Quatrième cadre : l'entraînement, sur le même axe de temps. C'est là que se
     lit le lien avec les courbes du dessus — un coefficient calculé sur si peu
     de points donnerait un chiffre faussement précis. */
  const top=3*CH.h, hi=top+CH.haut, lo=top+CH.bas;
  const sem=parSemaine(sc,t0,t1);
  const volMax=Math.max(...sem.map(w=>w.vol),1);
  const larg=Math.min(26,Math.max(1.5,(CH.x1-CH.x0)/Math.max(1,sem.length)-2));
  out+=`<text class="titre" x="0" y="${top+12}">Entraînement <tspan fill="var(--steel)">par semaine</tspan></text>`;
  if(!sc.length){
    out+=`<text class="ech" x="${CH.x0}" y="${(hi+lo)/2}">aucune séance enregistrée pour l'instant</text>`;
  } else {
    out+=`<line class="regle" x1="${CH.x0}" y1="${lo}" x2="${CH.x1}" y2="${lo}"/>
          <text class="ech" x="0" y="${hi+4}">${tonnes(volMax)}</text>`;
    sem.forEach(w=>{
      if(!w.vol) return;
      const h=Math.max(1.5,(w.vol/volMax)*(lo-hi));
      const x=X(w.t), l=Math.min(larg,CH.x1-x);          // aucune barre ne dépasse du cadre
      if(l<0.5) return;
      out+=`<rect x="${x.toFixed(1)}" y="${(lo-h).toFixed(1)}" width="${l.toFixed(1)}" height="${h.toFixed(1)}" rx="1" fill="var(--ink)" opacity=".72"/>`;
    });
    const total=sc.reduce((a,h)=>a+(h.vol||0),0);
    out+=`<text class="val" x="${CH.x1}" y="${top+13}">${tonnes(total)}</text>`;
  }
  const base=4*CH.h;
  out+=`<text class="ech" x="${CH.x0}" y="${base+4}">${jour(t0)}</text>
        <text class="ech" x="${CH.x1}" y="${base+4}" text-anchor="end">${jour(t1)}</text>
        <line class="viseur" id="viseur" x1="0" y1="14" x2="0" y2="${base-10}" style="display:none"/>`;
  return `<svg class="courbes" viewBox="0 -4 ${CH.w} ${base+14}" id="cbs"
            data-t0="${t0}" data-t1="${t1}">${out}</svg>`;
}

function renderBody(){
  const mes=(DATA.body||[]).slice().sort((a,b)=>b.d-a.d);
  const b0=borneBasse();
  const vues=surPlage(mes,b0), seances=surPlage(DATA.history,b0);
  const der=mes[0];
  /* tendance() refuse de comparer avec une pesée bien plus ancienne que la
     fenêtre demandée : mieux vaut ne rien dire qu'annoncer « en 30 jours » un
     écart qui porte en réalité sur un an. */
  const t30=tendance(30);
  const ecart = t30&&t30.kg!=null ? ` · ${signe(t30.kg)} kg en ${t30.j} jours` : "";
  view.innerHTML=`
  <div class="top" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
    <div><h1>Suivi</h1><div class="sub" id="b-sub">${der?`${der.kg!=null?kilo(der.kg)+" kg":"—"}${ecart}`:"Rien d'importé pour l'instant"}</div></div>
    <button id="b-import" class="sub" style="text-decoration:underline;text-underline-offset:3px;flex:none">Importer</button>
  </div>
  <div class="section">
    ${mes.length>1?`<div class="plages">${PLAGES.map(([j,nom])=>
        `<button data-plage="${j}" class="${j===plage?"actif":""}">${nom}</button>`).join("")}</div>`:""}
    ${vues.length>1?courbes(vues,seances):mes.length>1?`<div class="empty" style="border:0">Moins de deux mesures sur cette plage. Élargis-la.</div>`:`
      <div class="empty" style="border:0">Importe l'export de ta balance pour voir ton poids, ta masse grasse et ta masse musculaire évoluer ici.

      Sur le site de Withings, compte → télécharger mes données ; le fichier <code>weight.csv</code> de l'archive est celui à importer. Les exports d'autres balances passent aussi, tant que le fichier a une colonne de date et une de poids.</div>`}
    ${vues.length?(()=>{
      const per=periodes(vues,seances).filter(p=>p.n||p.dkg!=null);
      const utiles=per.filter(p=>p.n&&(p.dkg!=null||p.dmuscle!=null));
      return `
    <div class="section-h">Entraînement et mesures, par période de 4 semaines</div>
    ${utiles.length<2?`<div class="empty" style="border:0;padding:0 0 12px">Il faut deux périodes de quatre semaines comportant à la fois des séances et des pesées pour que la mise en regard ait un sens. ${utiles.length?"Une seule pour l'instant.":"Aucune pour l'instant."} Continue, ça se remplit tout seul.</div>`:""}
    ${per.length?`<table class="tab"><thead><tr>
      <th>Période</th><th>Séances</th><th>Volume</th>${SERIES.map(se=>`<th><span class="pastille" style="background:${se.c}"></span>Δ</th>`).join("")}
    </tr></thead><tbody>
      ${per.slice(0,6).map(p=>`<tr>
        <td>${jour(p.a)}</td><td>${p.n||"—"}</td><td>${p.vol?tonnes(p.vol):"—"}</td>
        ${SERIES.map(se=>`<td>${p["d"+se.k]!=null?signe(p["d"+se.k]):"—"}</td>`).join("")}
      </tr>`).join("")}
    </tbody></table>
    <div class="empty" style="border:0;padding-top:14px">Ce tableau met côte à côte ce que tu as fait et ce que la balance a mesuré pendant le même temps. Il ne prouve pas de lien de cause à effet : sur ces échelles, ce que tu manges et ce que tu dors pèsent plus lourd que la salle, et la composition corporelle répond en mois, pas en semaines.</div>`:""}
    <div class="section-h">Mesures</div>`;})():""}
    ${vues.length?`
    <table class="tab"><thead><tr>
      <th>Date</th>${SERIES.map(se=>`<th><span class="pastille" style="background:${se.c}"></span>${se.court}</th>`).join("")}
    </tr></thead><tbody>
      ${vues.slice(0,14).map(m=>`<tr><td>${jour(m.d)}</td>${SERIES.map(se=>`<td>${m[se.k]!=null?kilo(m[se.k]):"—"}</td>`).join("")}</tr>`).join("")}
    </tbody></table>
    <div class="empty" style="border:0;padding-top:14px">${vues.length} mesure${vues.length>1?"s":""} sur la plage${vues.length<mes.length?`, ${mes.length} en mémoire`:""}${vues.length>14?", les 14 dernières ci-dessus":""}, une par jour — la première, celle du matin. Elles partent chiffrées avec le reste si la sauvegarde en ligne est active.</div>`:""}
  </div>
  <input type="file" id="b-file" accept=".csv,text/csv,text/plain" style="display:none">
  <div class="foot"><button class="solid" id="home">Retour à l'accueil</button></div>`;
}

function readGear(){
  const g=DATA.gear, num=(id,d)=>{const v=parseFloat((el(id)||{}).value); return isNaN(v)?d:v;};
  g.bar=Math.max(1,num("g-bar",g.bar));
  g.dbBar=Math.max(0,num("g-dbbar",g.dbBar));
  g.dbMax=Math.max(0,num("g-dbmax",g.dbMax));
  g.dbStep=Math.max(0.25,num("g-dbstep",g.dbStep));
  document.querySelectorAll(".g-n").forEach(inp=>{
    const v=parseInt(inp.value,10); g.plates[+inp.dataset.i].n=isNaN(v)?0:Math.max(0,v);
  });
  g.plates=g.plates.filter(p=>p.n>0).sort((a,b)=>a.w-b.w);
  if(el("s-url")) DATA.sync={url:el("s-url").value.trim().replace(/\/$/,""), key:el("s-key").value.trim()};
}

let lastDone=null;

      return `<div class="empty" style="padding-top:18px">Sur les ${t.j} derniers jours : ${bouts.join(", ")}.</div>`;
    })()}
    <div class="empty" style="border:0;padding-top:12px">Niveau ${levelOf(d.id)}. Si elle t'a paru facile, monte d'un cran : la prochaine séance ${d.id} partira de là.</div>
    <div class="gline" style="border:0;padding-top:4px"><button class="add" id="hard-done" style="flex:1">C'était trop facile</button></div>
    ${persistent?"":`<div class="empty">Le stockage n'a pas répondu : cette séance ne sera pas retrouvée à la prochaine ouverture.</div>`}
  </div>
  <div class="foot"><button class="solid" id="home">Retour à l'accueil</button></div>`;
}

function render(){ if(S) saveCur(); S?renderSession():renderHome(); }

/* =========================================================
   7. INTERACTIONS
   ========================================================= */
view.addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  audioOn();

  if(b.dataset.start!=null) return startSession(+b.dataset.start);
  if(b.id==="home") return render();
  if(b.id==="gear") return renderGear();
  if(b.id==="suivi") return renderBody();
  if(b.id==="b-import") return el("b-file").click();
  if(b.dataset.plage!=null){ plage=+b.dataset.plage; return renderBody(); }
  if(b.id==="g-add"){
    readGear();
    const w=parseFloat(el("g-new").value);
    if(isNaN(w)||w<=0) return toast("Indique un poids de disque");
    const ex=DATA.gear.plates.find(p=>p.w===w);
    if(ex) ex.n++; else DATA.gear.plates.push({w,n:1});
    DATA.gear.plates.sort((a,b)=>a.w-b.w);
    buildLoads(); return renderGear();
  }
  if(b.dataset.del){ readGear(); DATA.gear.plates.splice(+b.dataset.del,1); buildLoads(); return renderGear(); }
  if(b.id==="s-now"){ readGear(); buildLoads(); DATA.updated=Date.now(); localSave(); return syncNow(false).then(()=>renderGear()); }
  if(b.id==="s-token"){
    readGear();
    const out=el("s-token-out"), phrase=(DATA.sync&&DATA.sync.key)||"";
    if(!phrase) return toast("Saisis d'abord ta phrase de chiffrement");
    out.style.display="block"; out.textContent="calcul…";
    return derive(phrase).then(k=>{ out.textContent=k.token; })
                         .catch(()=>{ out.textContent="Chiffrement indisponible sur ce navigateur."; });
  }
  if(b.id==="g-export"){ readGear(); save(); return exportData(); }
  if(b.id==="g-import"){ return el("g-file").click(); }
  if(b.id==="g-save"){ readGear(); buildLoads(); save(); toast("Matériel enregistré"); return render(); }
  if(b.id==="hard") return harder();
  if(b.id==="hard-done"){
    const n=raiseLevel(lastDone.id);
    if(n) toast("Niveau "+n+" : la prochaine séance "+lastDone.id+" partira de là");
    return renderDone(lastDone);
  }
  if(b.dataset.delh){
    const d=+b.dataset.delh, s=DATA.history.find(h=>h.d===d);
    if(s&&!confirm("Supprimer la séance "+s.id+" du "+jour(d)+" ?")) return render();
    deleteSession(d); toast("Séance supprimée");
    return render();
  }
  if(b.id==="go"){ const e=curEx(); return e.type==="time"?startWork():(validateSet(),render()); }
  if(b.id==="skip"){
    Timer.cancel(); S.i++; S.set=1;
    if(S.i>=S.p.ex.length) return finish();
    return render();
  }
  if(b.id==="prev"){
    Timer.cancel();
    if(S.set>1) S.set--; else if(S.i>0){ S.i--; S.set=S.p.ex[S.i].sets; }
    return render();
  }
  if(b.id==="quit"){
    /* Le seul endroit où l'on perd une séance en cours, et jamais par accident :
       on demande d'abord si on l'enregistre, puis on confirme l'abandon. */
    if(S.log.length){
      if(confirm("Enregistrer la séance telle quelle ?")) return finish();
      if(!confirm("Abandonner la séance ? Les séries déjà faites seront perdues.")) return;
    }
    keepAwake(false); Timer.cancel(); S=null; clearCur(); return render();
  }
  if(b.dataset.w){
    const e=curEx(), list=e.load==="bar"?BAR:DB;
    const k=Math.min(list.length-1,Math.max(0,nearest(list,S.w[S.i])+ +b.dataset.w));
    S.w[S.i]=list[k]; return render();
  }
  if(b.dataset.r){
    S.reps[S.i]=Math.max(0,S.reps[S.i]+ +b.dataset.r); return render();
  }
});

/* Balayage vers la gauche sur une ligne d'historique : la ligne glisse et
   découvre le bouton « Supprimer ». Le geste est suivi au doigt, et on ne prend
   la main que s'il est franchement horizontal, pour ne pas bloquer le défilement. */
const OUVERT=-108;
let sw=null;
view.addEventListener("pointerdown",ev=>{
  const wrap=ev.target.closest(".swipe");
  if(!wrap||ev.target.closest(".swipe-del")) return;
  sw={wrap, line:wrap.querySelector(".hist"), x:ev.clientX, y:ev.clientY,
      dx:wrap.classList.contains("open")?OUVERT:0, sens:null, id:ev.pointerId};
});
view.addEventListener("pointermove",ev=>{
  if(!sw||ev.pointerId!==sw.id) return;
  const dx=ev.clientX-sw.x, dy=ev.clientY-sw.y;
  if(sw.sens===null){
    if(Math.abs(dx)<6&&Math.abs(dy)<6) return;
    sw.sens=Math.abs(dx)>Math.abs(dy)?"h":"v";
    if(sw.sens==="h"){ try{ sw.wrap.setPointerCapture(ev.pointerId); }catch(e){} }
  }
  if(sw.sens!=="h") return;
  const depart=sw.wrap.classList.contains("open")?OUVERT:0;
  sw.dx=Math.max(OUVERT,Math.min(0,depart+dx));
  sw.line.style.transition="none";
  sw.line.style.transform="translateX("+sw.dx+"px)";
});
function endSwipe(){
  if(!sw) return;
  sw.line.style.transition=""; sw.line.style.transform="";
  if(sw.sens==="h"){
    const ouvrir=sw.dx<OUVERT/2;
    if(ouvrir) document.querySelectorAll(".swipe.open").forEach(o=>{ if(o!==sw.wrap) o.classList.remove("open"); });
    sw.wrap.classList.toggle("open",ouvrir);
  }
  sw=null;
}
view.addEventListener("pointerup",endSwipe);
view.addEventListener("pointercancel",endSwipe);

el("t-toggle").onclick=()=>Timer.toggle();
el("t-plus").onclick=()=>Timer.add(15);
el("t-minus").onclick=()=>Timer.add(-15);
/* Le minuteur porte sa propre suite : récupération → réaffichage, travail
   chronométré → série validée. Rien à décider ici. */
el("t-skip").onclick=()=>Timer.stop();

/* Dernier garde-fou : un rafraîchissement accidentel demande confirmation.
   Même s'il est accepté, la séance est retrouvée intacte au rechargement. */
window.addEventListener("beforeunload",e=>{ if(S){ e.preventDefault(); e.returnValue=""; } });

/* reprise correcte après mise en arrière-plan */
view.addEventListener("change",ev=>{
  if(ev.target.id==="g-file"&&ev.target.files[0]) importData(ev.target.files[0]);
  if(ev.target.id==="b-file"&&ev.target.files[0]) importBalance(ev.target.files[0]);
});

/* Lecture au doigt des courbes : un viseur qui suit le geste et remplace les
   valeurs affichées par celles de la date visée. Les mêmes chiffres restent
   lisibles dans le tableau, en dessous. */
let lect=null;
view.addEventListener("pointerdown",ev=>{
  const svg=ev.target.closest("#cbs"); if(!svg) return;
  lect={svg, x:ev.clientX, y:ev.clientY, sens:null, id:ev.pointerId};
});
view.addEventListener("pointermove",ev=>{
  if(!lect||ev.pointerId!==lect.id) return;
  if(lect.sens===null){
    const dx=Math.abs(ev.clientX-lect.x), dy=Math.abs(ev.clientY-lect.y);
    if(dx<5&&dy<5) return;
    /* un geste vertical appartient au défilement de la page, pas à la courbe */
    lect.sens = dx>dy ? "h" : "v";
    if(lect.sens==="h"){ try{ lect.svg.setPointerCapture(ev.pointerId); }catch(e){} }
  }
  if(lect.sens==="h") viser(lect.svg,ev);
});
function finLecture(){ if(lect){ if(lect.sens==="h") rendreValeurs(null); lect=null; } }
view.addEventListener("pointerup",finLecture);
view.addEventListener("pointercancel",finLecture);

function viser(svg,ev){
  const mes=(DATA.body||[]).slice().sort((a,b)=>a.d-b.d);
  if(mes.length<2) return;
  const r=svg.getBoundingClientRect();
  const x=(ev.clientX-r.left)/r.width*CH.w;
  const t0=+svg.dataset.t0, t1=+svg.dataset.t1;
  const part=Math.max(0,Math.min(1,(x-CH.x0)/(CH.x1-CH.x0)));
  const vise=t0+part*(t1-t0);
  let m=mes[0]; mes.forEach(c=>{ if(Math.abs(c.d-vise)<Math.abs(m.d-vise)) m=c; });
  const v=el("viseur");
  const px=CH.x0+(m.d-t0)/Math.max(1,t1-t0)*(CH.x1-CH.x0);
  v.setAttribute("x1",px); v.setAttribute("x2",px); v.style.display="";
  rendreValeurs(m);
}
function rendreValeurs(m){
  const mes=(DATA.body||[]).slice().sort((a,b)=>b.d-a.d);
  if(!m){ const v=el("viseur"); if(v) v.style.display="none"; }
  SERIES.forEach(se=>{
    const t=el("v-"+se.k); if(!t) return;
    const src = m || mes.find(x=>x[se.k]!=null) || {};
    t.textContent = (src[se.k]!=null? kilo(src[se.k]) : "—")+" "+se.u;
  });
  const st=el("b-sub");
  if(!st) return;
  if(m){
    if(st.dataset.origine==null) st.dataset.origine=st.textContent;
    st.textContent=jour(m.d)+(m.fatpc!=null?` · ${fmt(m.fatpc)} % de masse grasse`:"");
  } else if(st.dataset.origine!=null){
    st.textContent=st.dataset.origine; delete st.dataset.origine;
  }
}

function importBalance(file){
  const r=new FileReader();
  r.onload=()=>{
    let lu;
    try{ lu=lireBalance(String(r.result)); }
    catch(e){ return toast("Fichier illisible : "+e.message); }
    const avant=(DATA.body||[]).length;
    DATA.body=fusionCorps(lu.mesures,DATA.body);
    save(); renderBody();
    const neuves=DATA.body.length-avant;
    toast(neuves?`${neuves} nouvelle${neuves>1?"s":""} mesure${neuves>1?"s":""} importée${neuves>1?"s":""}`
                :"Aucune mesure nouvelle : tout était déjà là");
  };
  r.readAsText(file);
}

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    if(Timer.running) Timer.tick();
    if(S) keepAwake(true);
    else syncNow(true).then(ok=>{ if(ok&&!S) render(); });
  }
});

/* =========================================================
   8. DÉMARRAGE
   ========================================================= */
(async()=>{
  await load();
  const reprise=reprendre();
  render();
  if(reprise) toast("Séance reprise là où tu t'étais arrêté");
  if(await syncNow(true) && !S) render();
})();

})();
</script>

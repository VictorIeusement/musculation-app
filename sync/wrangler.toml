name = "seances-sync"
main = "worker.js"
compatibility_date = "2026-09-01"

# Remplacer id par celui que renvoie :
#   npx wrangler kv namespace create seances
[[kv_namespaces]]
binding = "DB"
id = "A_REMPLACER"

[vars]
# Origine autorisée à appeler le Worker. Mettre l'URL exacte du site GitHub Pages.
ALLOWED_ORIGIN = "https://A_REMPLACER.github.io"

# La clé partagée n'est pas ici : elle se pose en secret, hors du dépôt, avec
#   npx wrangler secret put SYNC_KEY
